##############################################################################
###############  ProForge 5 — Smart docking (WIP) — instrumentation  #########
##############################################################################
#
#  To run: temporarily add  [include smart-docking.cfg]  to printer.cfg, restart,
#  then in the console:   DOCK_PROBE PH=1     (repeat per head: PH=1..5)
#
#  DOCK_PROBE maps *grab-latch success vs seat depth* for one head. The servo's
#  locking pin can only rotate/latch if the carriage is pushed in far enough, and
#  carriage_tool_sensor read AFTER the pull-out is ground truth that the pin
#  actually latched (not just that the head is touching). This sweeps the seat
#  depth and logs, at each depth, whether the grab held.
#
#  SAFETY: this NEVER pushes deeper than your current nominal select_x. It sweeps
#  from START mm *shallower* down to nominal, so it maps the latch threshold on
#  the safe side and cannot ram the dock's back wall. If even the nominal depth
#  (offset +0.00) will not latch, that is itself the finding — the fix is a
#  deeper select_x, which we then explore carefully with reduced current (v2).
#
#  Read the result in the console / klippy.log: find the SHALLOWEST offset that
#  shows latched=PRESSED — that is your margin above the falls-off threshold.
#  A wide margin (latches even a few mm shallow) => intermittent failures are the
#  servo, not depth. A narrow/zero margin => select_x is marginal.
#
#  Params:  PH=<1..5>   START=<mm shallow, default 3.0>   STEP=<mm, default 0.5>
##############################################################################

[gcode_macro DOCK_PROBE]
description: Diagnostic - map grab-latch vs seat depth for one head (safe, no over-push)
gcode:
  {% set ph    = params.PH|default(1)|int %}
  {% set start = params.START|default(3.0)|float %}
  {% set step  = params.STEP|default(0.5)|float %}
  {% set idx   = ph - 1 %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set svv   = printer.save_variables.variables %}
  {% set active = svv.active_tools|default(0)|int %}
  M400
  {% if ph < 1 or ph > 5 or idx >= active %}
    { action_respond_info("DOCK_PROBE: PH%d not installed (active_tools=%d). Abort." % (ph, active)) }
  {% elif printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
    { action_respond_info("DOCK_PROBE: carriage occupied - dock it first. Abort.") }
  {% elif "xy" not in printer.toolhead.homed_axes %}
    { action_respond_info("DOCK_PROBE: home XY first (G28 X Y). Abort.") }
  {% elif printer["gcode_button t" ~ idx ~ "_dock_sensor"].state != "PRESSED" %}
    { action_respond_info("DOCK_PROBE: PH%d not seated in its dock - nothing to probe. Abort." % ph) }
  {% else %}
    {% set p = names[idx] %}
    { action_respond_info("=== DOCK_PROBE PH%d: sweeping select_x +%.2f -> +0.00 (step %.2f), never past nominal ===" % (ph, start, step)) }
    DUMP_TMC STEPPER=stepper_x
    {% set n = (start / step)|int + 1 %}
    {% for i in range(n) %}
      _DP_STEP PREFIX={p} IDX={idx} PH={ph} OFFSET={ (start - i * step)|round(2) }
    {% endfor %}
    G90
    G0 X15 F12000
    { action_respond_info("=== DOCK_PROBE PH%d done. Shallowest 'latched=PRESSED' = your margin. If +0.00 is RELEASED, nominal select_x is too shallow. ===" % ph) }
  {% endif %}

# One probe attempt at OFFSET mm shallower than nominal select_x.
# Splits the post-pull-out read into _DP_READ because Klipper renders a macro's
# whole template before its moves run - the fresh sensor read must be its own macro.
[gcode_macro _DP_STEP]
description: internal - single DOCK_PROBE attempt
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set p = params.PREFIX %}
  {% set off = params.OFFSET|float %}
  {% set sx = svv[p ~ "_select_x"]|float %}
  {% set sy = svv[p ~ "_select_y"]|float %}
  {% set dy = svv[p ~ "_dock_y"]|float %}
  G90
  G0 Y{sy} F12000
  G0 X{sx + 7} F9000
  G0 X{sx + off} F1000          # seat to TEST depth (off >= 0, so never past nominal)
  G0 Y{dy} F1000                # Y-slide that engages the coupling
  _SERVO_SELECT                 # attempt the locking-pin rotation
  G0 X{sx + 8} F6000            # pull-out test position (same as normal extract start)
  M400
  _DP_READ PREFIX={p} IDX={params.IDX} PH={params.PH} OFFSET={off}

# Fresh read after the pull-out; log latch result; if it grabbed, re-dock so the
# next step starts from a docked head.
[gcode_macro _DP_READ]
description: internal - DOCK_PROBE post-pull-out read
gcode:
  M400
  {% set p = params.PREFIX %}
  {% set off = params.OFFSET|float %}
  {% set latched = printer["gcode_button carriage_tool_sensor"].state %}
  { action_respond_info("DOCK_PROBE PH%d  seat=select_x+%.2f  latched=%s" % (params.PH|int, off, latched)) }
  {% if latched == "PRESSED" %}
    {% set svv = printer.save_variables.variables %}
    {% set dx = svv[p ~ "_dock_x"]|float %}
    {% set dy = svv[p ~ "_dock_y"]|float %}
    {% set sy = svv[p ~ "_select_y"]|float %}
    G90
    G0 Y{dy} F6000
    G0 X{dx + 31} F9000
    G0 X{dx} F2000
    _SERVO_DOCK
    G0 Y{sy} F4000
    G0 X{dx + 10} F9000
  {% endif %}
