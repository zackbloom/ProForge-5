##############################################################################
###############  ProForge 5 — Smart docking (WIP) — instrumentation  #########
##############################################################################
#
#  To run: temporarily add  [include smart-docking.cfg]  to printer.cfg, restart,
#  then in the console:   DOCK_PROBE PH=1     (repeat per head: PH=1..5)
#
#  GOAL: find how much EXTRA seat depth past your (empirically-tuned) nominal
#  select_x makes the grab latch MORE reliably, WITHOUT the carriage ramming the
#  dock wall and losing X/Y steps. Nominal already works most of the time; the
#  falls-off failures are under-push, so the reliability headroom is DEEPER.
#
#  HOW IT STAYS SAFE past nominal:
#   * the final seat push runs at REDUCED X/Y current (param CURRENT) so if the
#     carriage reaches the dock's back wall it STALLS/SLIPS gently instead of
#     skipping steps;
#   * it re-homes X Y before every attempt, so any slip can't accumulate;
#   * the sweep is bounded (default +1.0 mm deeper than nominal).
#
#  carriage_tool_sensor read AFTER the pull-out is ground truth that the locking
#  pin actually latched (not just that the head is touching).
#
#  READ THE RESULT (console / klippy.log): the DEEPEST 'latched=PRESSED' that
#  still completes cleanly is your reliable seat. Tune CURRENT so nominal
#  (seat=select_x-0.00) latches; if it won't even at nominal, current is too low.
#
#  Params:  PH=<1..5>  MAX=<mm deeper, default 1.0>  STEP=<mm, default 0.25>
#           CURRENT=<A for the seat push, default 1.6; normal run is 2.2>
##############################################################################

[gcode_macro DOCK_PROBE]
description: Diagnostic - map grab-latch vs EXTRA seat depth at reduced current (safe past nominal)
gcode:
  {% set ph    = params.PH|default(1)|int %}
  {% set maxd  = params.MAX|default(1.0)|float %}
  {% set step  = params.STEP|default(0.25)|float %}
  {% set cur   = params.CURRENT|default(1.6)|float %}
  {% set idx   = ph - 1 %}
  {% set names = ['zero','one','two','three','four'] %}
  {% set svv   = printer.save_variables.variables %}
  {% set active = svv.active_tools|default(0)|int %}
  {% set nrun  = printer.configfile.settings["tmc5160 stepper_x"].run_current %}
  M400
  {% if ph < 1 or ph > 5 or idx >= active %}
    { action_respond_info("DOCK_PROBE: PH%d not installed (active_tools=%d). Abort." % (ph, active)) }
  {% elif printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
    { action_respond_info("DOCK_PROBE: carriage occupied - dock it first. Abort.") }
  {% elif "xy" not in printer.toolhead.homed_axes %}
    { action_respond_info("DOCK_PROBE: home XY first (G28 X Y). Abort.") }
  {% elif printer["gcode_button t" ~ idx ~ "_dock_sensor"].state != "PRESSED" %}
    { action_respond_info("DOCK_PROBE: PH%d not seated in its dock. Abort." % ph) }
  {% else %}
    {% set p = names[idx] %}
    { action_respond_info("=== DOCK_PROBE PH%d: nominal -> +%.2fmm DEEPER (step %.2f), seat current %.2fA (normal %.2fA) ===" % (ph, maxd, step, cur, nrun)) }
    _SERVO_DOCK                              # reset locking pin to open (55deg) before the sweep
    {% set n = (maxd / step)|int + 1 %}
    {% for i in range(n) %}
      _DP_STEP PREFIX={p} IDX={idx} PH={ph} DEEP={ (i * step)|round(2) } CUR={cur}
    {% endfor %}
    _DP_RESTORE_CURRENT
    G90
    G0 X15 F12000
    { action_respond_info("=== DOCK_PROBE PH%d done. Deepest 'latched=PRESSED' that finished cleanly = reliable seat. ===" % ph) }
  {% endif %}

[gcode_macro _DP_RESTORE_CURRENT]
description: internal - restore X/Y TMC current to configured values
gcode:
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={printer.configfile.settings["tmc5160 stepper_x"].run_current} HOLDCURRENT={printer.configfile.settings["tmc5160 stepper_x"].hold_current}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={printer.configfile.settings["tmc5160 stepper_y"].run_current} HOLDCURRENT={printer.configfile.settings["tmc5160 stepper_y"].hold_current}

# One probe attempt DEEP mm past nominal, at reduced current. Re-homes first so a
# prior slip can't accumulate. Post-pull-out read is split into _DP_READ because
# Klipper renders a macro's template before its moves execute.
[gcode_macro _DP_STEP]
description: internal - single deeper-seat probe attempt at reduced current
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set p = params.PREFIX %}
  {% set deep = params.DEEP|float %}
  {% set cur = params.CUR|float %}
  {% set sx = svv[p ~ "_select_x"]|float %}
  {% set sy = svv[p ~ "_select_y"]|float %}
  {% set dy = svv[p ~ "_dock_y"]|float %}
  G28 X Y                                    # accurate position each attempt (at normal current)
  _SERVO_DOCK                                # reset pin to open (55deg) so THIS grab is a fresh rotation
                                             # (a prior failed _SERVO_SELECT leaves it locked at 137deg)
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cur}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cur}
  G90
  G0 Y{sy} F12000
  G0 X{sx + 7} F9000
  G0 X{sx - deep} F800                       # seat to nominal MINUS deep (deeper = smaller X)
  G0 Y{dy} F800                              # Y-slide engage
  _SERVO_SELECT
  G0 X{sx + 15} F6000                        # pull the head OFF the dock pins (a good latch drags it clear)
  M400
  _DP_READ PREFIX={p} IDX={params.IDX} PH={params.PH} DEEP={deep}

[gcode_macro _DP_READ]
description: internal - restore current, fresh read after pull-out, log, re-dock if grabbed
gcode:
  M400
  _DP_RESTORE_CURRENT
  {% set p = params.PREFIX %}
  {% set idx = params.IDX|int %}
  {% set deep = params.DEEP|float %}
  {% set carriage = printer["gcode_button carriage_tool_sensor"].state %}
  {% set dock = printer["gcode_button t" ~ idx ~ "_dock_sensor"].state %}
  # good latch = the head came off the dock pins WITH the carriage:
  #   carriage switch still PRESSED (head held) AND the head's dock switch RELEASED (off the pins)
  {% set latched = (carriage == "PRESSED") and (dock == "RELEASED") %}
  { action_respond_info("DOCK_PROBE PH%d  seat=select_x-%.2f  carriage=%s dock=%s  => %s"
      % (params.PH|int, deep, carriage, dock, "LATCHED" if latched else "NOT latched")) }
  {% set svv = printer.save_variables.variables %}
  {% set dx = svv[p ~ "_dock_x"]|float %}
  {% set dy = svv[p ~ "_dock_y"]|float %}
  {% set sy = svv[p ~ "_select_y"]|float %}
  {% if latched %}
    # good grab - put the head back so the next depth starts docked
    G90
    G0 Y{dy} F6000
    G0 X{dx + 31} F9000
    G0 X{dx} F2000
    _SERVO_DOCK
    G0 Y{sy} F4000
    G0 X{dx + 10} F9000
  {% elif dock == "PRESSED" %}
    # clean fail: the head never left its dock pins - it is safe, nothing to recover
    { action_respond_info("  (head stayed on its dock pins - safe)") }
  {% else %}
    # ambiguous: head came OFF the pins but is NOT on the carriage - it may have only
    # slid out. Reset the pin, gently push it back onto the pins, and re-check the head
    # switch: if it re-triggers the head is fine (this depth just did not latch); if not,
    # the head has fallen.
    { action_respond_info("  head off pins and not held - nudging it back onto the pins to check for a drop...") }
    _SERVO_DOCK
    G90
    G0 Y{dy} F6000
    G0 X{dx + 20} F9000
    G0 X{dx + 5} F3000
    G0 X{dx} F400
    M400
    _DP_RECOVER IDX={idx} PH={params.PH} DEEP={deep}
  {% endif %}

[gcode_macro _DP_RECOVER]
description: internal - after nudging a slid head back, confirm it's on the pins or declare it fallen
gcode:
  M400
  G4 P250
  {% set idx = params.IDX|int %}
  {% set deep = params.DEEP|float %}
  {% if printer["gcode_button t" ~ idx ~ "_dock_sensor"].state == "PRESSED" %}
    { action_respond_info("DOCK_PROBE PH%d  seat=select_x-%.2f  => NOT latched (head had slid off; recovered onto pins - safe to continue)" % (params.PH|int, deep)) }
  {% else %}
    { action_raise_error("DOCK_PROBE PH%d HEAD FELL at seat=select_x-%.2f: dock switch will not re-trigger. STOP and check the machine." % (params.PH|int, deep)) }
  {% endif %}


##############################################################################
#  SEAT_REPEAT_PH1 - measure head-1 SEATING repeatability via the cal sensor
#
#  Grabs head 1, locates the nozzle-contact sensor (TOOL_LOCATE_SENSOR), docks,
#  and repeats. The spread in x/y/z across the rows is head 1's seating
#  repeatability (plus the sensor's own measurement noise). Homes ONCE up front,
#  so the machine frame is fixed and only the head re-seats each cycle.
#
#  Run with the calibration sensor installed and head 1 docked:
#     SEAT_REPEAT_PH1                 # 5 iters at 150C (matches real calibration)
#     SEAT_REPEAT_PH1 ITERATIONS=8
#     SEAT_REPEAT_PH1 TEMP=0          # cold run - isolates seating from nozzle ooze
##############################################################################

[gcode_macro SEAT_REPEAT_PH1]
description: Measure head-1 seating repeatability using the calibration sensor
gcode:
  {% set iters = params.ITERATIONS|default(5)|int %}
  {% set temp = params.TEMP|default(150)|float %}
  M400
  {% if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
    { action_respond_info("SEAT_REPEAT_PH1: carriage occupied - dock it first. Abort.") }
  {% elif printer["gcode_button t0_dock_sensor"].state != "PRESSED" %}
    { action_respond_info("SEAT_REPEAT_PH1: head 1 not seated in its dock. Abort.") }
  {% else %}
    G28
    { action_respond_info("=== SEAT_REPEAT_PH1: %d iterations, nozzle %.0fC (frame homed once; only head re-seats) ===" % (iters, temp)) }
    {% if temp > 0 %}
      M104 T0 S{temp}
      M109 T0 S{temp}
    {% endif %}
    {% for i in range(iters) %}
      _PSR_ONE ITER={i + 1}
    {% endfor %}
    M104 T0 S0
    { action_respond_info("=== SEAT_REPEAT_PH1 done. Spread of x/y/z across rows = head-1 seating repeatability (+sensor noise). ===") }
  {% endif %}

[gcode_macro _PSR_ONE]
description: internal - one grab / verify / locate / dock cycle
gcode:
  _CAL_SELECT_T0
  M400
  _PSR_CHECK_PICKUP ITER={params.ITER}

[gcode_macro _PSR_CHECK_PICKUP]
description: internal - verify head 1 actually picked up before probing a (possibly bare) carriage
gcode:
  M400
  {% if printer["gcode_button carriage_tool_sensor"].state != "PRESSED" %}
    { action_raise_error("SEAT_REPEAT_PH1 iter=%s: head 1 did NOT pick up (carriage empty) - aborting so it won't probe a bare carriage. Fix the grab first (test SELECT_PH1 / DOCK_PROBE)." % params.ITER) }
  {% else %}
    _CALIBRATE_MOVE_OVER_PROBE
    TOOL_LOCATE_SENSOR
    M400
    _PSR_READ ITER={params.ITER}
  {% endif %}

[gcode_macro _PSR_READ]
description: internal - read the located sensor position (fresh), log, dock head 1
gcode:
  M400
  {% set r = printer.tools_calibrate %}
  { action_respond_info("SEAT_REPEAT_PH1 iter=%s  x=%.4f  y=%.4f  z=%.4f"
      % (params.ITER, r.last_x_result, r.last_y_result, r.last_z_result)) }
  _CAL_DOCK_T0


##############################################################################
#  RESOLVE_MULTI_DOCK - recover from "multiple installed print heads read
#  undocked" WITHOUT relying on which tool is active (hard-reset safe).
#
#  When that error fires there is a head ON the carriage and 2+ docks read
#  undocked. The non-home ones are heads that are physically present but not
#  seated. Use the MOUNTED head as a gentle pusher to reseat each stray onto its
#  pins; the dock that STAYS undocked afterwards is, by elimination, the empty
#  home - so a normal DOCK then places the mounted head correctly.
#
#  Heads are identical, so the pusher can't reach the target's dock_x - it stops
#  one head-width short. Approach to dock_x+48, then VERY gently push to dock_x+43
#  at reduced current (a stray that's already seated / an empty dock just slips).
#  The servo is NEVER released during the bumps, so the mounted head can't drop.
#
#  Usage (manual for now; not yet wired into the DOCK error branch):
#     RESOLVE_MULTI_DOCK
##############################################################################

[gcode_macro RESOLVE_MULTI_DOCK]
description: Reseat stray heads with the mounted head, then dock (hard-reset safe)
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set active = svv.active_tools|default(0)|int %}
  {% set cur = params.CURRENT|default(1.6)|float %}
  M400
  {% if printer["gcode_button carriage_tool_sensor"].state != "PRESSED" %}
    { action_respond_info("RESOLVE_MULTI_DOCK: no head on the carriage - use RESEAT_DOCKS instead. Abort.") }
  {% elif "xy" not in printer.toolhead.homed_axes %}
    { action_respond_info("RESOLVE_MULTI_DOCK: home XY first. Abort.") }
  {% else %}
    { action_respond_info("=== RESOLVE_MULTI_DOCK: gently reseating stray heads with the mounted head ===") }
    {% for pair in [('zero',0),('one',1),('two',2),('three',3),('four',4)] %}
      {% if pair[1] < active and printer["gcode_button t" ~ pair[1] ~ "_dock_sensor"].state == "RELEASED" %}
        _RMD_BUMP PREFIX={pair[0]} IDX={pair[1]} CUR={cur}
      {% endif %}
    {% endfor %}
    _DP_RESTORE_CURRENT
    { action_respond_info("RESOLVE_MULTI_DOCK: strays reseated - handing to DOCK to place the mounted head in the remaining home.") }
    DOCK
  {% endif %}

[gcode_macro _RMD_BUMP]
description: internal - gently push a stray head onto its pins using the mounted head
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set p = params.PREFIX %}
  {% set cur = params.CUR|float %}
  {% set dx = svv[p ~ "_dock_x"]|float %}
  {% set dy = svv[p ~ "_dock_y"]|float %}
  G90
  G0 Y{dy} F9000
  G0 X{dx + 48} F9000                    # approach one head-width + margin out (normal current)
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cur}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cur}
  G0 X{dx + 43} F300                      # VERY gentle 5mm push - seat the stray onto its pins
  M400
  _DP_RESTORE_CURRENT
  G0 X{dx + 48} F6000                     # back off, mounted head still held
  M400
  _RMD_CHECK IDX={params.IDX}

[gcode_macro _RMD_CHECK]
description: internal - report whether the bumped dock now reads seated
gcode:
  M400
  {% set idx = params.IDX|int %}
  {% if printer["gcode_button t" ~ idx ~ "_dock_sensor"].state == "PRESSED" %}
    { action_respond_info("  dock PH%d: reseated OK (now reads docked)" % (idx + 1)) }
  {% else %}
    { action_respond_info("  dock PH%d: still empty - candidate home for the mounted head" % (idx + 1)) }
  {% endif %}
