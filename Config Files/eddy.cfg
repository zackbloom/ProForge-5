
############################################################################
######################### ProForge 5 Eddy Config ###########################
############################################################################

#config file version v1.1.0
#release date: 03.06.2026

[mcu eddy]
serial: /dev/serial/by-id/usb-Klipper_rp2040_Eddy-if00 
restart_method: command

[probe_eddy_ng btt_eddy]
sensor_type: btt_eddy
i2c_mcu: eddy
i2c_bus: i2c0f
x_offset: 36.6
y_offset: 21.25
tap_adjust_z: -0.0125
tap_target_z: -2.5

[temperature_sensor btt_eddy_mcu]
sensor_type: temperature_mcu
sensor_mcu: eddy
min_temp: 10
max_temp: 100

[temperature_sensor btt_eddy]
sensor_type: Generic 3950
sensor_pin: eddy:gpio26

[safe_z_home]
home_xy_position: 250, 200
z_hop: 10
z_hop_speed: 25
speed: 200

[bed_mesh]
horizontal_move_z: 2
speed: 150
mesh_min: 40, 40  # If the probe cannot reach then you will get a klipper error when trying to scan a bed mesh.
mesh_max: 460, 360 # If the probe cannot reach then you will get a klipper error when trying to scan a bed mesh.
probe_count: 25, 20
algorithm: bicubic
#scan_overshoot: 8
adaptive_margin: 5
zero_reference_position: 250, 200
fade_start: 1
fade_end: 10

[gcode_macro EDDY_CAL]
gcode:
  RESPOND MSG="Heating PH1 to 150C..."
  M104 S150 T0 
  RESPOND MSG="Heating Bed to 100C..."
  M140 S100
  TEMPERATURE_WAIT SENSOR=extruder MINIMUM=150
  TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM=100
  SELECT_PH1
  CENTER
  PROBE_EDDY_NG_SETUP

[gcode_macro BED_MESH_SCAN]
gcode:
  _CHOME
  DOCK
  Z_TILT_ADJUST
  BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=1 ADAPTIVE_MARGIN=50
  G90
  G1 Z15 F600       ; Lower bed 

[gcode_macro _BED_MESH_SCAN_ALL]
gcode:
  _CHOME
  DOCK
  Z_TILT_ADJUST
  BED_MESH_CALIBRATE METHOD=rapid_scan ADAPTIVE=0
  G90
  G1 Z15 F600       ; Lower bed 

[gcode_macro TAP]
gcode:
  # Clear the re-tap flag on every fresh TAP so it is 1 ONLY when THIS tap aborted headless. Without
  # this a stale 1 from an earlier aborted print would make a later mid-print tool-change RESUME
  # wrongly re-home+re-probe in the middle of a print.
  SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=tap_retap_pending VALUE=0
  _CHOME
  SELECT_PH1
  # SELECT_PH1 grabs PH1. If that grab MISSED (proud head, switch not tripped, etc.) the carriage is
  # EMPTY - and the pickup-fail path only schedules its pause on a delayed_gcode, which fires too late
  # to stop this linear macro. Probing an empty carriage drives the bare toolhead into the bed (no
  # nozzle to trigger the tap). We can't gate the probe with a Jinja if/endif inside THIS macro
  # because Klipper renders the whole template before any line runs, so the sensor read would be stale
  # (pre-grab). Hand off to a separate macro that re-renders with the REAL post-grab sensor state.
  _TAP_IF_HEADED

[gcode_macro _TAP_IF_HEADED]
description: internal - probe ONLY if a head is actually on the carriage; otherwise PAUSE instead of tapping headless
gcode:
  # TAP must NEVER probe without a tool: a headless tap drives the bare coil/toolhead into the bed.
  # So here we are STRICT and require the CARRIAGE SWITCH to actually confirm a tool. The dock-sensor
  # OR-fallback used by the other checks is deliberately NOT used for TAP - for those a false "no tool"
  # only costs a pause, but for TAP a false "tool present" is a crash, so TAP fails safe: if the
  # carriage switch can't confirm a head, it pauses instead of probing.
  {% if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
    PROBE_EDDY_NG_SET_TAP_OFFSET VALUE=0
    CENTER
    # THROWAWAY first tap. In a 5-tap back-to-back test the FIRST tap's computed zero was ~0.87mm
    # off from the rest (a fresh ooze blob / first-contact settle), while taps 2..5 landed in a
    # ~0.15mm band. Prints do a single tap, so they inherited that first-tap error - the "brutal"
    # offset. Discard the first contact, dwell to settle, then take the real tap.
    PROBE_EDDY_NG_TAP
    G4 P250
    # PROBE_EDDY_NG_TAP ends with a temp-comp step that shifts the toolhead by (-x_offset,-y_offset)
    # to put the COIL over the spot the nozzle tapped - so after the throwaway the NOZZLE is left at
    # ~(213.4,178.75), NOT 250,200. Re-CENTER so the real tap lands on the SAME spot the throwaway
    # just primed (otherwise the real tap hits a fresh, ooze-skewed first contact and the throwaway
    # is wasted), and so every tap is measured at the same, repeatable point.
    CENTER
    PROBE_EDDY_NG_TAP
  {% else %}
    { action_respond_info("!! TAP ABORTED - carriage switch RELEASED: no head on the carriage. NOT probing (would ram the bare toolhead into the bed). Fix the PH1 pickup, then RESUME - it will re-grab and re-tap.") }
    M117 TAP aborted: no head on carriage
    # Mark that Z0 was never established - RESUME must re-grab AND re-run the probe (not just continue).
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=tap_retap_pending VALUE=1
    _TOOLCHANGER_PAUSE MSG=no_head_on_carriage_TAP_aborted
  {% endif %}

[gcode_macro TRAM]
gcode:
  _CHOME
  DOCK
  Z_TILT_ADJUST

[gcode_macro VIBRATION_CAL]
gcode:
  _CHOME
  SELECT_PH1
  CENTER
  SHAPER_CALIBRATE

