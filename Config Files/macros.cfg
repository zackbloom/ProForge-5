############################## Carriage & Print Head Switch Logic ###############################

[gcode_macro toolchanger_sensor_status]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set active_tools = svv.active_tools|default(5)|int %}

    {% set t0 = printer["gcode_button t0_dock_sensor"].state if active_tools > 0 else "N/A" %}
    {% set t1 = printer["gcode_button t1_dock_sensor"].state if active_tools > 1 else "N/A" %}
    {% set t2 = printer["gcode_button t2_dock_sensor"].state if active_tools > 2 else "N/A" %}
    {% set t3 = printer["gcode_button t3_dock_sensor"].state if active_tools > 3 else "N/A" %}
    {% set t4 = printer["gcode_button t4_dock_sensor"].state if active_tools > 4 else "N/A" %}

    { action_respond_info(
        "Carriage=" ~ printer["gcode_button carriage_tool_sensor"].state ~
        " | PH1=" ~ t0 ~
        " | PH2=" ~ t1 ~
        " | PH3=" ~ t2 ~
        " | PH4=" ~ t3 ~
        " | PH5=" ~ t4
    ) }

[gcode_macro _TOOLCHANGER_PAUSE]
gcode:
  {% set msg = params.MSG|default("toolchanger_error")|replace("_", " ") %}
  { action_respond_info(msg) }
  M117 {msg}
  {% if printer.print_stats.state == "printing" %}
    PAUSE_BASE
  {% endif %}

[gcode_macro _toolchanger_state]
variable_can_continue: 1
variable_already_selected: 0
variable_pending_tool: -1
variable_tap_retap_pending: 0   # 1 = TAP aborted headless; RESUME must re-grab AND re-probe Z0, not just continue
gcode:

[gcode_macro DOCK]
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set active_tools = svv.active_tools|default(0)|int %}
  {% set carriage = printer["gcode_button carriage_tool_sensor"].state %}

  _TOOLCHANGER_CLEAR_PENDING
  SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=1
  _TC_LOG CTX="dock_entry"

  {% if active_tools < 1 %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
    _TOOLCHANGER_PAUSE MSG=active_tools_is_invalid

  {% else %}
    {% set t0_docked = 1 if active_tools > 0 and printer["gcode_button t0_dock_sensor"].state == "PRESSED" else 0 %}
    {% set t1_docked = 1 if active_tools > 1 and printer["gcode_button t1_dock_sensor"].state == "PRESSED" else 0 %}
    {% set t2_docked = 1 if active_tools > 2 and printer["gcode_button t2_dock_sensor"].state == "PRESSED" else 0 %}
    {% set t3_docked = 1 if active_tools > 3 and printer["gcode_button t3_dock_sensor"].state == "PRESSED" else 0 %}
    {% set t4_docked = 1 if active_tools > 4 and printer["gcode_button t4_dock_sensor"].state == "PRESSED" else 0 %}
    {% set docked_count = t0_docked + t1_docked + t2_docked + t3_docked + t4_docked %}

    {% set t0_open = 1 if active_tools > 0 and printer["gcode_button t0_dock_sensor"].state == "RELEASED" else 0 %}
    {% set t1_open = 1 if active_tools > 1 and printer["gcode_button t1_dock_sensor"].state == "RELEASED" else 0 %}
    {% set t2_open = 1 if active_tools > 2 and printer["gcode_button t2_dock_sensor"].state == "RELEASED" else 0 %}
    {% set t3_open = 1 if active_tools > 3 and printer["gcode_button t3_dock_sensor"].state == "RELEASED" else 0 %}
    {% set t4_open = 1 if active_tools > 4 and printer["gcode_button t4_dock_sensor"].state == "RELEASED" else 0 %}
    {% set open_count = t0_open + t1_open + t2_open + t3_open + t4_open %}
    {% set atool = 0 if printer.toolhead.extruder == "extruder" else printer.toolhead.extruder[8:]|int %}
    {% set held = svv.held_tool|default(-1)|int %}
    {% set printing = printer.print_stats.state == "printing" %}

    {% if carriage != "PRESSED" %}
      # Nothing on the carriage -> nothing to dock. Do NOT demand every dock switch read
      # docked; a parked head's flaky/dead switch is irrelevant when we hold nothing.
      SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=1
      { action_respond_info("DOCK: carriage empty - nothing to dock") }

    {% elif printer.toolhead.extruder != "extruder" and atool < active_tools and printer["gcode_button t" ~ atool ~ "_dock_sensor"].state == "RELEASED" %}
      # AUTHORITATIVE: a non-PH1 tool is the active extruder. Every grab path (SELECT, _PRIME_PHn,
      # the tap) calls ACTIVATE_EXTRUDER, so the active extruder is the true answer for what is on
      # the carriage THIS session. Its own dock reads empty (head is out) - consistent. Dock it to
      # its own dock. This deliberately BEATS the persisted record, which can go stale and drive the
      # wrong head into an already-occupied dock (the PH4-into-PH3 head-to-head collision).
      { action_respond_info("DOCK: docking active tool PH%d to its OWN dock (authoritative)" % (atool + 1)) }
      _DOCK_TOOL TOOL={atool}

    {% elif held >= 0 and held < active_tools and printer["gcode_button t" ~ held ~ "_dock_sensor"].state == "RELEASED" %}
      # Active extruder is the PH1 default (e.g. just restarted with a head held) - fall back to the
      # persisted record, but ONLY if the recorded head's own dock reads empty (consistent with it
      # being the one that is out). Never dock into a dock that reads occupied.
      { action_respond_info("DOCK: docking recorded held head PH%d to its own dock" % (held + 1)) }
      _DOCK_TOOL TOOL={held}

    {% elif atool == 0 and printer.toolhead.extruder == "extruder" and printer["gcode_button t0_dock_sensor"].state == "RELEASED" %}
      # Default active extruder and PH1's own dock is empty -> PH1 is the held head. Dock PH1.
      { action_respond_info("DOCK: docking active tool PH1 to its OWN dock") }
      _DOCK_TOOL TOOL=0

    {% else %}
      # Carriage occupied but I cannot confirm which head is held AND that its own dock is empty.
      # Do NOT guess - a wrong guess drives a head into an occupied dock (the collision you saw).
      # Pause and let the user declare it.
      SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
      { action_respond_info("DOCK: carriage occupied but can't confirm which head is held (active=PH%d, recorded=%d) - refusing to guess to avoid a collision. Run DOCK_HELD T=<n>." % (atool + 1, held)) }
      _TOOLCHANGER_PAUSE MSG=cannot_confirm_which_head_is_held__run_DOCK_HELD
    {% endif %}
  {% endif %}

# After DOCK auto-reseats on a multi-undocked read, re-read the docks (fresh, post-move)
# and finish: if exactly ONE home is still undocked it's the mounted head's home, so dock
# it there; if MORE than one is still undocked (e.g. a dead dock switch), pause. Runs once
# per DOCK - it never calls DOCK again, so it can't loop or recurse.
# Dock a KNOWN head (the trusted active tool). We already know which head it is, so we
# verify only that the carriage cleared - NOT that the head's dock switch reads docked,
# because that switch may be flaky. If the carriage came clear, the head is off it and in
# the home _DOCK_PHn just drove to. Deferred check (like the stock post-dock check).
# Human-declaration fallback: when a restart (or a fault) leaves a head on the carriage but the
# system can't self-identify it (e.g. two docks read empty because one head is genuinely missing
# or a dock switch is flaky), tell it which head is held and it docks that head to its own dock.
# Usage:  DOCK_HELD T=4   (T is the HEAD NUMBER 1-5 currently on the carriage)
[gcode_macro DOCK_HELD]
description: Declare which head (1-5) is on the carriage and dock it to its own dock
gcode:
  {% set n = params.T|default(0)|int %}
  {% set tool = n - 1 %}
  {% set svv = printer.save_variables.variables %}
  {% set active_tools = svv.active_tools|default(0)|int %}
  {% if tool < 0 or tool >= active_tools %}
    { action_respond_info("DOCK_HELD: T must be a head number 1..%d (the head on the carriage). Got T=%d." % (active_tools, n)) }
  {% elif printer["gcode_button carriage_tool_sensor"].state != "PRESSED" %}
    { action_respond_info("DOCK_HELD: carriage reads EMPTY - nothing to dock. Aborting.") }
  {% else %}
    { action_respond_info("DOCK_HELD: recording PH%d as the held head and docking it to its own dock." % n) }
    SAVE_VARIABLE VARIABLE=held_tool VALUE={tool}
    _DOCK_TOOL TOOL={tool}
  {% endif %}

[gcode_macro _DOCK_TOOL]
description: internal - dock a specific known tool, lenient on its (possibly flaky) dock switch
gcode:
  {% set tool = params.TOOL|int %}
  {% if tool == 0 %}
    _DOCK_PH1
  {% elif tool == 1 %}
    _DOCK_PH2
  {% elif tool == 2 %}
    _DOCK_PH3
  {% elif tool == 3 %}
    _DOCK_PH4
  {% else %}
    _DOCK_PH5
  {% endif %}
  M400
  SET_GCODE_VARIABLE MACRO=_post_dock_state VARIABLE=tool VALUE={tool}
  UPDATE_DELAYED_GCODE ID=_delayed_dock_tool_check DURATION=0.1

[delayed_gcode _delayed_dock_tool_check]
gcode:
  {% set tool = printer["gcode_macro _post_dock_state"].tool|int %}
  {% if tool < 0 %}
    { action_respond_info("dock-tool check skipped, invalid tool") }
  {% elif printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
    _TOOLCHANGER_PAUSE MSG={"dock_failed_head_still_on_carriage_PH" ~ (tool + 1)}
  {% else %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=1
    SAVE_VARIABLE VARIABLE=held_tool VALUE=-1              # carriage clear - nothing held now
    { action_respond_info("DOCK: PH" ~ (tool + 1) ~ " docked - carriage clear (dock switch not required, trusted active tool)") }
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_post_dock_state VARIABLE=tool VALUE=-1

[gcode_macro _DOCK_AFTER_RESEAT]
description: internal - finish a DOCK after an auto-reseat (dock the one remaining home, or pause)
gcode:
  M400
  {% set svv = printer.save_variables.variables %}
  {% set active_tools = svv.active_tools|default(0)|int %}
  {% set t0_open = 1 if active_tools > 0 and printer["gcode_button t0_dock_sensor"].state == "RELEASED" else 0 %}
  {% set t1_open = 1 if active_tools > 1 and printer["gcode_button t1_dock_sensor"].state == "RELEASED" else 0 %}
  {% set t2_open = 1 if active_tools > 2 and printer["gcode_button t2_dock_sensor"].state == "RELEASED" else 0 %}
  {% set t3_open = 1 if active_tools > 3 and printer["gcode_button t3_dock_sensor"].state == "RELEASED" else 0 %}
  {% set t4_open = 1 if active_tools > 4 and printer["gcode_button t4_dock_sensor"].state == "RELEASED" else 0 %}
  {% set open_count = t0_open + t1_open + t2_open + t3_open + t4_open %}
  _TC_LOG CTX="dock_after_reseat"
  {% if printer["gcode_button carriage_tool_sensor"].state != "PRESSED" %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
    _TOOLCHANGER_PAUSE MSG=head_lost_from_carriage_during_reseat
  {% elif open_count > 1 %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
    _TOOLCHANGER_PAUSE MSG=still_multiple_undocked_after_reseat__check_dock_switches
  {% elif open_count == 0 %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
    _TOOLCHANGER_PAUSE MSG=no_empty_home_after_reseat__cannot_place_mounted_head
  {% else %}
    { action_respond_info("reseat resolved it - one empty home remains, docking the mounted head there") }
    {% if t0_open %}
      _DOCK_PH1
      {% set tool = 0 %}
    {% elif t1_open %}
      _DOCK_PH2
      {% set tool = 1 %}
    {% elif t2_open %}
      _DOCK_PH3
      {% set tool = 2 %}
    {% elif t3_open %}
      _DOCK_PH4
      {% set tool = 3 %}
    {% else %}
      _DOCK_PH5
      {% set tool = 4 %}
    {% endif %}
    {% if printer["gcode_macro _toolchanger_state"].can_continue|int == 1 %}
      M400
      SET_GCODE_VARIABLE MACRO=_post_dock_state VARIABLE=tool VALUE={tool}
      UPDATE_DELAYED_GCODE ID=_delayed_post_dock_check DURATION=0.1
    {% endif %}
  {% endif %}

[gcode_macro _PRE_SELECT_CHECK]
gcode:
  {% set tool = params.TOOL|int %}
  {% set svv = printer.save_variables.variables %}
  {% set active_tools = svv.active_tools|default(0)|int %}
  {% set carriage_pressed = 1 if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" else 0 %}
  {% set dock_sensor = "gcode_button t" ~ tool ~ "_dock_sensor" %}
  {% set held = svv.held_tool|default(-1)|int %}

  _TOOLCHANGER_CLEAR_PENDING
  SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=1
  SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=already_selected VALUE=0
  SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=pending_tool VALUE={tool}   # this tool is the TARGET of an in-progress change; RESUME re-grabs THIS, not the stale active extruder

  {% if tool < 0 or tool >= active_tools %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
    _TOOLCHANGER_PAUSE MSG={"PH" ~ (tool + 1) ~ "_is_not_installed"}

  {% elif carriage_pressed and held == tool %}
    # Skip ONLY when the RECORD (held_tool) says the head on the carriage IS the target. The old
    # test - "a head is on the carriage AND the target's dock reads empty" - falsely skipped the
    # change when a DIFFERENT head was attached and the target's dock read empty (flaky switch /
    # head elsewhere), leaving the wrong head mounted while Tn switched the motor -> the docked
    # target head extruded into its dock and the mounted head printed dry (the "no tower extrusion").
    { action_respond_info("PH" ~ (tool + 1) ~ " already selected (held record matches) - skipping dock and reselect") }
    M117 PH{tool + 1} already selected
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=already_selected VALUE=1

  {% else %}
    {% if carriage_pressed %}
      # A head is on the carriage but the record says it is NOT the target (held=%d, want this tool).
      # DOCK it first (DOCK uses the record to put the RIGHT head in its own dock), then grab target.
      DOCK
    {% else %}
      {% set p = ['zero','one','two','three','four'][tool] %}
      {% if printer[dock_sensor].state == "PRESSED" %}
        _SERVO_DOCK
      {% else %}
        # Target reads UNDOCKED before we even grab. It may just be proud (present, but the dock
        # switch not quite tripped - PH1's shallow dock does this). Nudge it onto its dock to trip
        # the switch before concluding it is missing; _PRE_SELECT_VERIFY re-reads the sensor next.
        _NUDGE_SEAT PREFIX={p} IDX={tool}
      {% endif %}
    {% endif %}
    _PRE_SELECT_VERIFY TOOL={tool}
  {% endif %}

[gcode_macro _PRE_SELECT_VERIFY]
gcode:
  {% set tool = params.TOOL|int %}
  {% set name = "gcode_button t" ~ tool ~ "_dock_sensor" %}

  M400
  G4 P300

  {% if printer["gcode_macro _toolchanger_state"].can_continue|int == 0 %}
    { action_respond_info("pre-select check failed") }

  {% elif printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
    _TOOLCHANGER_PAUSE MSG=carriage_still_occupied_after_docking

  {% elif printer[name].state != "PRESSED" %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
    _TOOLCHANGER_PAUSE MSG={"PH" ~ (tool + 1) ~ "_is_not_docked_cannot_select"}

  {% else %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=1
    { action_respond_info("pre-select check passed for PH" ~ (tool + 1)) }
  {% endif %}

[gcode_macro _post_select_state]
variable_tool: -1
gcode:

[gcode_macro _post_dock_state]
variable_tool: -1
gcode:

[gcode_macro _TOOLCHANGER_CLEAR_PENDING]
gcode:
  UPDATE_DELAYED_GCODE ID=_delayed_post_select_check DURATION=0
  UPDATE_DELAYED_GCODE ID=_delayed_post_dock_check DURATION=0
  UPDATE_DELAYED_GCODE ID=_delayed_dock_tool_check DURATION=0
  SET_GCODE_VARIABLE MACRO=_post_select_state VARIABLE=tool VALUE=-1
  SET_GCODE_VARIABLE MACRO=_post_dock_state VARIABLE=tool VALUE=-1
  SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=already_selected VALUE=0

[gcode_macro _POST_SELECT_CHECK]
gcode:
  {% set tool = params.TOOL|int %}
  M400
  G4 P100                                  # settle (replaces the old 0.1s delayed_gcode timer)
  SET_GCODE_VARIABLE MACRO=_post_select_state VARIABLE=tool VALUE={tool}
  _POST_SELECT_VERIFY1 TOOL={tool}

# Pickup verification with up to two DEEPER reseat retries. Runs SYNCHRONOUSLY (inside
# the tool change, before the print continues) - a retry does MOVES, and firing those
# from the old async delayed_gcode would race the next print move into a collision.
# A good pickup = carriage PRESSED (head held) AND the head's dock sensor RELEASED
# (off the pins). Unrolled VERIFY1->VERIFY2->VERIFY3 because Klipper forbids a macro
# re-entering itself. Only after both retries fail does it pause the print (deferred).
[gcode_macro _POST_SELECT_VERIFY1]
gcode:
  M400
  {% set tool = params.TOOL|int %}
  {% set dname = "gcode_button t" ~ tool ~ "_dock_sensor" %}
  {% if tool < 0 %}
    { action_respond_info("post select check skipped, invalid tool") }
  {% elif printer["gcode_button carriage_tool_sensor"].state == "PRESSED" and printer[dname].state == "RELEASED" %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=1
    { action_respond_info("PH" ~ (tool + 1) ~ " selected successfully") }
    SAVE_VARIABLE VARIABLE=held_tool VALUE={tool}          # persist which head is held (survives restart)
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=pending_tool VALUE=-1   # change complete - no target pending
  {% else %}
    { action_respond_info("PH" ~ (tool + 1) ~ " pickup missed - re-grabbing at SAME depth (retry 1 of 2), no deeper push") }
    _REGRAB_DEEPER TOOL={tool} DEPTH=0.0
    _POST_SELECT_VERIFY2 TOOL={tool}
  {% endif %}

[gcode_macro _POST_SELECT_VERIFY2]
gcode:
  M400
  {% set tool = params.TOOL|int %}
  {% set dname = "gcode_button t" ~ tool ~ "_dock_sensor" %}
  {% if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" and printer[dname].state == "RELEASED" %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=1
    { action_respond_info("PH" ~ (tool + 1) ~ " selected on retry 1 (same depth)") }
    SAVE_VARIABLE VARIABLE=held_tool VALUE={tool}          # persist which head is held (survives restart)
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=pending_tool VALUE=-1   # change complete - no target pending
  {% else %}
    { action_respond_info("PH" ~ (tool + 1) ~ " pickup missed - re-grabbing at SAME depth (retry 2 of 2), no deeper push") }
    _REGRAB_DEEPER TOOL={tool} DEPTH=0.0
    _POST_SELECT_VERIFY3 TOOL={tool}
  {% endif %}

[gcode_macro _POST_SELECT_VERIFY3]
gcode:
  M400
  {% set tool = params.TOOL|int %}
  {% set dname = "gcode_button t" ~ tool ~ "_dock_sensor" %}
  {% if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" and printer[dname].state == "RELEASED" %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=1
    { action_respond_info("PH" ~ (tool + 1) ~ " selected on retry 2 (same depth)") }
    SAVE_VARIABLE VARIABLE=held_tool VALUE={tool}          # persist which head is held (survives restart)
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=pending_tool VALUE=-1   # change complete - no target pending
  {% else %}
    # Give up after 2 reseat retries. Before reopening the LOCKED pin (a failed grab left the cam
    # locked), cross-check the target's DOCK sensor so we never drop a mis-read head:
    #   dock PRESSED  -> head confirmed sitting in its dock, carriage genuinely empty -> reopen here.
    #   dock RELEASED -> head is NOT in its dock AND carriage reads empty: UNACCOUNTED for (may be
    #                    held with a dead/flaky carriage switch). Opening off-dock would DROP it, so
    #                    re-seat at the dock first, then open.
    {% if printer[dname].state == "PRESSED" %}
      _SERVO_DOCK
    {% else %}
      _REDOCK_THEN_OPEN TOOL={tool}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
    UPDATE_DELAYED_GCODE ID=_delayed_post_select_check DURATION=0.1
  {% endif %}

# Reached ONLY after both reseat retries failed. Pauses the print, deferred to a clean
# context (the original reason this check used a delayed_gcode). _TOOLCHANGER_CLEAR_PENDING
# cancels this timer before the next select, so a recovered change won't pause later.
[delayed_gcode _delayed_post_select_check]
gcode:
  {% set tool = printer["gcode_macro _post_select_state"].tool|int %}
  {% if tool >= 0 %}
    _TOOLCHANGER_PAUSE MSG={"pickup_failed_after_2_reseat_retries_for_PH" ~ (tool + 1)}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=_post_select_state VARIABLE=tool VALUE=-1

# Generic re-grab for a failed pickup: reseat DEEPER by DEPTH mm at REDUCED current so a
# deeper seat SLIPS at the dock wall instead of skipping steps, then retreat fully to X0
# (clear of the forks) before returning. Self-contained; works for any head via its vars.
[gcode_macro _REGRAB_DEEPER]
description: re-attempt a missed pickup at reduced current; DEPTH mm past the seat (DEPTH=0 = SAME calibrated depth, never rams the backstop)
gcode:
  {% set tool = params.TOOL|int %}
  {% set depth = params.DEPTH|default(0.25)|float %}
  {% set p = ['zero','one','two','three','four'][tool] %}
  {% set svv = printer.save_variables.variables %}
  {% set sx = svv[p ~ '_select_x']|float %}
  {% set sy = svv[p ~ '_select_y']|float %}
  {% set dy = svv[p ~ '_dock_y']|float %}
  {% set cfg = printer.configfile.settings %}
  {% set rx = cfg["tmc5160 stepper_x"].run_current %}
  {% set ry = cfg["tmc5160 stepper_y"].run_current %}
  {% set hx = cfg["tmc5160 stepper_x"].hold_current %}
  {% set hy = cfg["tmc5160 stepper_y"].hold_current %}
  _SERVO_DOCK                              # open cam so this is a fresh full rotation
  G90
  G0 Y{sy} F12000
  G0 X{sx + 7} F9000
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.6
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.6
  G0 X{sx - depth} F800                    # gentle seat to (calibrated - DEPTH); DEPTH=0 = same seat, never past the backstop
  G0 Y{dy} F800
  _SERVO_SELECT
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={rx} HOLDCURRENT={hx}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={ry} HOLDCURRENT={hy}
  G0 X{sx + 8} F12000                      # pull off (full current)
  G0 X0 F12000                             # RETREAT FULLY CLEAR before any diagonal
  M400

# Safe pin release for the "head unaccounted for" case (carriage reads empty AND the head is not in
# its dock - which happens when the carriage switch is dead/flaky and a head is actually still held).
# Re-seat at the dock cradle BEFORE opening the pin so a mis-read held head settles into its dock
# instead of dropping off-dock. Reduced current so any contact slips rather than rams. Mirrors the
# proven _REGRAB_DEEPER motion (Y move done clear at X0, pure-X in and out - no diagonal off the pins).
[gcode_macro _REDOCK_THEN_OPEN]
description: internal - re-seat a possibly-held head at its dock, THEN open the pin (dead-switch drop guard)
gcode:
  {% set tool = params.TOOL|int %}
  {% set p = ['zero','one','two','three','four'][tool] %}
  {% set svv = printer.save_variables.variables %}
  {% set cfg = printer.configfile.settings %}
  {% set dx = svv[p ~ '_dock_x']|float %}
  {% set dy = svv[p ~ '_dock_y']|float %}
  {% set rx = cfg["tmc5160 stepper_x"].run_current %}
  {% set ry = cfg["tmc5160 stepper_y"].run_current %}
  {% set hx = cfg["tmc5160 stepper_x"].hold_current %}
  {% set hy = cfg["tmc5160 stepper_y"].hold_current %}
  { action_respond_info("SAFE-RELEASE: PH" ~ (tool+1) ~ " unaccounted for (not in its dock, carriage reads empty). Re-seating at the dock before opening the pin so a mis-read held head cannot drop.") }
  G90
  G0 X0 F12000                             # ensure fully clear of the forks before any Y move
  G0 Y{dy} F12000                          # to the head's dock row (Y move done clear at X0)
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.2   # reduced current: any contact slips, no ram
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT=1.2
  G0 X{dx} F1500                           # into the dock cradle (a secretly-held head seats here)
  M400
  _SERVO_DOCK                              # NOW open the pin - the head settles into its cradle
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={rx} HOLDCURRENT={hx}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={ry} HOLDCURRENT={hy}
  G0 X0 F12000                             # retreat clear (pure X off the pins)
  M400


[delayed_gcode _delayed_post_dock_check]
gcode:
  {% set tool = printer["gcode_macro _post_dock_state"].tool|int %}
  {% set name = "gcode_button t" ~ tool ~ "_dock_sensor" %}

  {% if tool < 0 %}
    { action_respond_info("post dock check skipped, invalid tool") }

  {% elif printer["gcode_button carriage_tool_sensor"].state != "RELEASED" %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
    _TOOLCHANGER_PAUSE MSG={"dock_failed_carriage_still_triggered_after_docking_PH" ~ (tool + 1)}

  {% elif printer[name].state != "PRESSED" %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
    _TOOLCHANGER_PAUSE MSG={"dock_failed_PH" ~ (tool + 1) ~ "_switch_not_triggered_after_docking"}

  {% else %}
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=1
    { action_respond_info("PH" ~ (tool + 1) ~ " docked successfully") }
  {% endif %}

  SET_GCODE_VARIABLE MACRO=_post_dock_state VARIABLE=tool VALUE=-1








# PRIME and WIPE Commands


[gcode_macro _PRIME_PH1]
description: Pick up PH1, move to X=-92, prime 25mm, wipe pattern, then dock
gcode:
  _PRE_SELECT_CHECK TOOL=0
  {% if printer["gcode_macro _toolchanger_state"].can_continue|int == 1 %}
    _CHOME_TOOL
    {% set svv = printer.save_variables.variables %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    G90
    G0 Y{svv.zero_select_y} F20000
    G0 X{svv.zero_select_x + 50} F20000
    G0 X{svv.zero_select_x + 7} F10000
    G0 X{svv.zero_select_x} F3000
    G0 Y{svv.zero_dock_y} F3000
    _SERVO_SELECT
    # Tool is now locked to carriage but still on pins
    _PRIME_AND_WIPE TOOL=0
  {% endif %}

[gcode_macro _PRIME_PH2]
gcode:
  _PRE_SELECT_CHECK TOOL=1
  {% if printer["gcode_macro _toolchanger_state"].can_continue|int == 1 %}
    _CHOME_TOOL
    {% set svv = printer.save_variables.variables %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder1
    G90
    G0 Y{svv.one_select_y} F20000
    G0 X{svv.one_select_x + 50} F20000
    G0 X{svv.one_select_x + 7} F10000
    G0 X{svv.one_select_x} F3000
    G0 Y{svv.one_dock_y} F3000
    _SERVO_SELECT
    _PRIME_AND_WIPE TOOL=1
  {% endif %}

[gcode_macro _PRIME_PH3]
gcode:
  _PRE_SELECT_CHECK TOOL=2
  {% if printer["gcode_macro _toolchanger_state"].can_continue|int == 1 %}
    _CHOME_TOOL
    {% set svv = printer.save_variables.variables %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder2
    G90
    G0 Y{svv.two_select_y} F20000
    G0 X{svv.two_select_x + 50} F20000
    G0 X{svv.two_select_x + 7} F10000
    G0 X{svv.two_select_x} F3000
    G0 Y{svv.two_dock_y} F3000
    _SERVO_SELECT
    _PRIME_AND_WIPE TOOL=2
  {% endif %}

[gcode_macro _PRIME_PH4]
gcode:
  _PRE_SELECT_CHECK TOOL=3
  {% if printer["gcode_macro _toolchanger_state"].can_continue|int == 1 %}
    _CHOME_TOOL
    {% set svv = printer.save_variables.variables %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder3
    G90
    G0 Y{svv.three_select_y} F20000
    G0 X{svv.three_select_x + 50} F20000
    G0 X{svv.three_select_x + 7} F10000
    G0 X{svv.three_select_x} F3000
    G0 Y{svv.three_dock_y} F3000
