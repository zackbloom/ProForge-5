  {% if printer["gcode_button t" ~ idx ~ "_dock_sensor"].state == "PRESSED" %}
    _DOCK_SEAT_DONE IDX={idx} EARLY=2 OFF=3.0
  {% else %}
    _DOCK_SEAT_DONE IDX={idx} EARLY=0 OFF=3.0
  {% endif %}

[gcode_macro _DOCK_SEAT_DONE]
gcode:
  {% set cfg = printer.configfile.settings %}
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cfg["tmc5160 stepper_x"].run_current} HOLDCURRENT={cfg["tmc5160 stepper_x"].hold_current}
  {% set idx = params.IDX|int %}
  {% if params.EARLY|int == 1 %}
    { action_respond_info("DOCK: PH%d seated early - switch tripped %.1fmm before dock_x, push stopped (no over-ram)" % (idx + 1, params.OFF|float)) }
  {% elif params.EARLY|int == 2 %}
    { action_respond_info("DOCK: PH%d seated - switch tripped %.1fmm PAST dock_x (dock_x is shallow; consider deepening it)" % (idx + 1, params.OFF|float)) }
  {% elif printer["gcode_button t" ~ idx ~ "_dock_sensor"].state == "PRESSED" %}
    { action_respond_info("DOCK: PH%d seated at dock_x" % (idx + 1)) }
  {% else %}
    { action_respond_info("DOCK: PH%d pushed to dock_x-3 but the dock switch never tripped - dead switch or badly wrong dock_x" % (idx + 1)) }
  {% endif %}

