  ACTIVATE_EXTRUDER EXTRUDER=extruder4



[gcode_macro _OFFSET_RESET]
description: Reset any offsets.
gcode:
  SET_GCODE_OFFSET X=0
  SET_GCODE_OFFSET Y=0
  SET_GCODE_OFFSET Z=0



[gcode_macro _SERVO_DOCK]
gcode:
  SET_SERVO SERVO=toolchanger ANGLE=55              # Set cam release angle
  G4 P1100                                           # Allow time to make move

[gcode_macro _SERVO_SELECT]
gcode:
  SET_SERVO SERVO=toolchanger ANGLE=145              # Set cam locking angle
  G4 P1100                                           # Allow time to make move


[gcode_macro _WIPE]
gcode:
  {% if printer[printer.toolhead.extruder].temperature >= 165 %}
  G92 E0
  G0 E-0.5 F5000
  G92 E0
  {% endif %}
  G91
  G1 X+12 F3500
  G1 X-12 F3500
  G1 X+12 F3500
  G1 X-12 F3500
  G90

[gcode_macro _RETRACT]
gcode:
  {% if printer[printer.toolhead.extruder].temperature >= 170 %}
  G92 E0
  G0 E-6 F6000
  G92 E0
  {% endif %}

[gcode_macro _PRIME]
gcode:
  {% if printer[printer.toolhead.extruder].temperature >= 165 %}
  G92 E0
  G0 E3 F3000
  G92 E0
  {% endif %}

[gcode_macro _ZHOP]
gcode:
  {% if printer.virtual_sdcard.is_active %}
  G91
  G1 Z1 F2000
  G90
  {% endif %}






# Each SELECT_PHx outer macro only runs the pre-check and then hands off to its
# inner _SELECT_PHx macro. The inner macro's Jinja2 is rendered when IT
# runs (after _PRE_SELECT_CHECK has finished), so it reads the fresh values of
# can_continue and already_selected instead of the stale pre-call values.

[gcode_macro _NUDGE_SEAT]
description: Gently seat head IDX onto its dock if it reads undocked, before a grab (no-op if docked)
gcode:
  {% set p = params.PREFIX %}
  {% set idx = params.IDX|int %}
  {% set svv = printer.save_variables.variables %}
  {% set cfg = printer.configfile.settings %}
  {% set dock_x = svv[p ~ "_dock_x"]|float %}
  {% set dock_y = svv[p ~ "_dock_y"]|float %}
  # If a head is on the carriage, push with the MOUNTED head (its body reaches the dock at
  # dock_x+43) and keep the pin LOCKED - opening it would drop the mounted head. If the carriage
  # is bare, open the pin and push with the bare carriage at dock_x.
  {% set mounted = 1 if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" else 0 %}
  {% set off = 43 if mounted else 0 %}
  {% if idx < svv.active_tools|default(0)|int and printer["gcode_button t" ~ idx ~ "_dock_sensor"].state == "RELEASED" %}
    { action_respond_info("NUDGE: PH%d reads undocked before grab - gentle push to seat it (%s pusher)" % (idx + 1, "mounted-head @ +43" if mounted else "bare carriage")) }
    {% if not mounted %}
      _SERVO_DOCK                                 # bare carriage only - open the pin to push without grabbing
    {% endif %}
    G90
    G0 Y{dock_y} F9000
    G0 X{dock_x + off + 8} F9000                  # standoff, clear of the head
    SET_VELOCITY_LIMIT ACCEL=300                  # low accel - no jerk into the head
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=0.7
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT=0.7
    G0 X{dock_x + off} F200                        # gentle push to seated X; slips at the backstop, cannot ram
    M400
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cfg["tmc5160 stepper_x"].run_current} HOLDCURRENT={cfg["tmc5160 stepper_x"].hold_current}
    SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cfg["tmc5160 stepper_y"].run_current} HOLDCURRENT={cfg["tmc5160 stepper_y"].hold_current}
    SET_VELOCITY_LIMIT ACCEL={cfg.printer.max_accel}
    G0 X{dock_x + off + 8} F9000                  # back off to standoff (full current restored)
    M400
    _NUDGE_SEAT_REPORT IDX={idx}
  {% endif %}

# Deferred (post-move) report of whether the nudge seated the head - the switch read has to
# happen AFTER the push completes, so it lives in its own macro (rendered when dequeued).
[gcode_macro _NUDGE_SEAT_REPORT]
description: internal - report whether _NUDGE_SEAT got the switch to trip
gcode:
  {% set idx = params.IDX|int %}
  {% if printer["gcode_button t" ~ idx ~ "_dock_sensor"].state == "PRESSED" %}
    { action_respond_info("NUDGE: PH%d now reads seated (switch tripped) - ready to grab" % (idx + 1)) }
  {% else %}
    { action_respond_info("NUDGE: PH%d still reads undocked after the push - likely absent or a dead switch; the grab will confirm" % (idx + 1)) }
  {% endif %}

# ---------------------------------------------------------------------------
# Switch-triggered grab seat. Instead of ramming to a FIXED select_x (which over-pushes a
# head that's where it should be, and under-engages a proud/thermally-drifted one), advance
# SLOWLY onto the head in 0.5mm steps and STOP the instant the CARRIAGE switch trips (head
# contacted), then engage ENGAGE mm more so the locking pin can bite. Adapts to the head's
# real position; the low current means any contact just slips instead of skipping steps.
# Caller (_TC_GRAB) sets reduced current + low accel and leaves us at ~select_x+7.
# Unrolled (Klipper forbids a macro re-entering itself).
# ---------------------------------------------------------------------------
[gcode_macro _grab_seat_state]
variable_engage: 1.5
variable_seated: 0
variable_sx: 0        # absolute calibrated grab X (select_x) for the head being seated; set by _GRAB_SEAT
gcode:

[gcode_macro _GRAB_SEAT]
description: advance onto the head until the CARRIAGE switch trips, then +ENGAGE mm (no fixed over-push)
gcode:
  {% set p = params.PREFIX %}
  {% set sx = printer.save_variables.variables[p ~ "_select_x"]|float %}
  SET_GCODE_VARIABLE MACRO=_grab_seat_state VARIABLE=engage VALUE={params.ENGAGE|default(1.5)|float}
  SET_GCODE_VARIABLE MACRO=_grab_seat_state VARIABLE=seated VALUE=0
  SET_GCODE_VARIABLE MACRO=_grab_seat_state VARIABLE=sx VALUE={sx}   # absolute grab target for _GRAB_SEAT_ENGAGE
  G90
  G0 X{sx + 2.5} F600                            # start of the seat sweep (2.5mm out from nominal)
  _GRAB_SEAT_1

# Seat sweep, unrolled (Klipper forbids a macro re-entering itself). Starts at select_x+2.5 and
# steps inward 0.5mm/step. Extended from 7 to 12 steps so the switch is checked all the way to
# ~select_x-3.0 - a proud/drifted head that used to bottom out the old sweep (deepest check was only
# select_x-0.5) now still trips the switch and gets grabbed. Reduced current (set by _TC_GRAB) means
# a real contact SLIPS rather than skipping steps. The terminal step (12) does NOT force-engage:
# if nothing tripped across a full 5.5mm sweep the head is genuinely absent (or the switch is dead),
# and driving deeper would only ram - so it stops and lets the post-select / TAP guard pause instead.
[gcode_macro _GRAB_SEAT_1]
gcode:
  M400
  {% if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
    _GRAB_SEAT_ENGAGE
  {% else %}
    G91
    G0 X-0.5 F400
    G90
    _GRAB_SEAT_2
  {% endif %}

[gcode_macro _GRAB_SEAT_2]
gcode:
  M400
  {% if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
    _GRAB_SEAT_ENGAGE
  {% else %}
    G91
    G0 X-0.5 F400
    G90
    _GRAB_SEAT_3
  {% endif %}

[gcode_macro _GRAB_SEAT_3]
gcode:
  M400
  {% if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
    _GRAB_SEAT_ENGAGE
  {% else %}
    G91
    G0 X-0.5 F400
    G90
    _GRAB_SEAT_4
  {% endif %}

[gcode_macro _GRAB_SEAT_4]
gcode:
  M400
  {% if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
    _GRAB_SEAT_ENGAGE
  {% else %}
    G91
    G0 X-0.5 F400
    G90
    _GRAB_SEAT_5
  {% endif %}

[gcode_macro _GRAB_SEAT_5]
gcode:
  M400
  {% if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
    _GRAB_SEAT_ENGAGE
  {% else %}
    G91
    G0 X-0.5 F400
    G90
    _GRAB_SEAT_6
  {% endif %}

[gcode_macro _GRAB_SEAT_6]
gcode:
  M400
  {% if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
    _GRAB_SEAT_ENGAGE
  {% else %}
    # End of the sweep: we are at ~select_x and the carriage switch never tripped. That switch is NOT
    # a reliable "head present" signal on every head - a solidly-held head can still read RELEASED -
    # so do NOT give up. Fall back to the calibrated fixed-depth grab and bite the pin right here,
    # exactly like the old grab did (which worked). A truly absent head just closes the pin on empty
    # space; the print path's post-select check still catches a real miss, and calibration / DOCK no
    # longer stall waiting on a switch that isn't going to trip. Small 0.5mm bite = negligible drag.
    { action_respond_info("GRAB_SEAT: no carriage trip across the sweep - falling back to the fixed-depth grab at select_x (carriage switch marginal for this head)") }
    _GRAB_SEAT_ENGAGE
  {% endif %}

[gcode_macro _GRAB_SEAT_ENGAGE]
description: internal - drive to the calibrated grab position (select_x) so the cam engages a fully seated head
gcode:
  {% set sx = printer["gcode_macro _grab_seat_state"].sx|float %}
  {% if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
    { action_respond_info("GRAB_SEAT: carriage switch tripped - driving to select_x (%.2f) to fully seat before the cam engages" % sx) }
    SET_GCODE_VARIABLE MACRO=_grab_seat_state VARIABLE=seated VALUE=1
  {% endif %}
  # Drive to the ABSOLUTE calibrated grab position, NOT a fixed offset past the switch-trip point.
  # The carriage switch trips EARLY (at first proximity), so advancing a fixed ~1.5mm past it left the
  # cam engaging 1-2mm SHORT of the real seat - the head was not pulled fully onto the carriage when
  # the cam turned. select_x is the known full-seat position where the old fixed-depth grab locked.
  G90
  G0 X{sx} F400
  M400

[gcode_macro _TC_GRAB]
description: internal - reliable head grab (servo reset + reduced-current seat), any head via PREFIX
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set cfg = printer.configfile.settings %}
  {% set p = params.PREFIX %}
  {% set cur = params.CURRENT|default(1.6)|float %}
  {% set sx = svv[p ~ "_select_x"]|float %}
  {% set sy = svv[p ~ "_select_y"]|float %}
  {% set dy = svv[p ~ "_dock_y"]|float %}
  {% set idx = {'zero':0,'one':1,'two':2,'three':3,'four':4}[p] %}
  _NUDGE_SEAT PREFIX={p} IDX={idx}               # seat a proud head before grabbing (no-op if it reads docked)
  _SERVO_DOCK                                   # pin fully OPEN first - stock _SELECT skipped this
  G90
  G0 Y{sy} F20000
  G0 X{sx + 50} F20000
  G0 X{sx + 7} F10000                           # fast approach at full current to the standoff
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cur}   # reduced current: a contact just slips, no step skip
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cur}
  SET_VELOCITY_LIMIT ACCEL=400                  # low accel for the gentle switch-triggered seat sweep
  _GRAB_SEAT PREFIX={p} ENGAGE=1.5              # advance slowly until the CARRIAGE switch trips, then +1.5mm for the pin - adapts to the head's real position (proud / drifted), no fixed over-push
  G0 Y{dy} F800
  _SERVO_SELECT                                 # lock (rotate cam) while held at reduced current
  SET_VELOCITY_LIMIT ACCEL={cfg.printer.max_accel}
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cfg["tmc5160 stepper_x"].run_current} HOLDCURRENT={cfg["tmc5160 stepper_x"].hold_current}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cfg["tmc5160 stepper_y"].run_current} HOLDCURRENT={cfg["tmc5160 stepper_y"].hold_current}
  G0 X{sx + 8} F12000                           # pull the head off; caller runs _PRIME then retreats to X0

[gcode_macro SELECT_PH1]
gcode:
  _PRE_SELECT_CHECK TOOL=0
  _SELECT_PH1

[gcode_macro _SELECT_PH1]
gcode:
  {% if printer["gcode_macro _toolchanger_state"].can_continue|int == 1
     and printer["gcode_macro _toolchanger_state"].already_selected|int == 0 %}
    _CHOME_TOOL
    {% set svv = printer.save_variables.variables %}
    ACTIVATE_EXTRUDER EXTRUDER=extruder
    _TC_GRAB PREFIX=zero
    _PRIME
    #_WIPE
    G0 X0 F12000
    {% if "xyz" in printer.toolhead.homed_axes %}
      SET_GCODE_OFFSET X=0
      SET_GCODE_OFFSET Y=0
      SET_GCODE_OFFSET Z=0
    {% endif %} 
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_restore_tool VALUE=0
    SET_GCODE_VARIABLE MACRO=_RESUME_WIPE VARIABLE=extruder_restore_tool VALUE=0
    _POST_SELECT_CHECK TOOL=0
  {% endif %}
   

# ---------------------------------------------------------------------------
# Seat a grabbed head onto its dock pins, STOPPING the instant the dock switch
# trips instead of ramming all the way to dock_x - which is what over-stresses
# and snaps the switch tines. The final approach runs at REDUCED X current so it
# can't hammer the switch even in the gap between checks. It steps dock_x+0.4 ->
# +0.2 -> dock_x, checking the switch after each; a dead/absent switch just falls
# through to dock_x exactly as before. Unrolled (no macro re-enters itself);
# shared by every _DOCK_PHn.
# ---------------------------------------------------------------------------
[gcode_macro _DOCK_SEAT]
description: internal - seat a head onto its pins, stopping when its dock switch trips
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set dx = svv[params.PREFIX ~ "_dock_x"]|float %}
  G90
  G0 X{dx + 0.6} F2000
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.6
  _DOCK_SEAT_1 PREFIX={params.PREFIX} IDX={params.IDX}

[gcode_macro _DOCK_SEAT_1]
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set dx = svv[params.PREFIX ~ "_dock_x"]|float %}
  {% set idx = params.IDX|int %}
  G0 X{dx + 0.4} F500
  M400
  {% if printer["gcode_button t" ~ idx ~ "_dock_sensor"].state == "PRESSED" %}
    _DOCK_SEAT_DONE IDX={idx} EARLY=1 OFF=0.4
  {% else %}
    _DOCK_SEAT_2 PREFIX={params.PREFIX} IDX={idx}
  {% endif %}

[gcode_macro _DOCK_SEAT_2]
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set dx = svv[params.PREFIX ~ "_dock_x"]|float %}
  {% set idx = params.IDX|int %}
  G0 X{dx + 0.2} F500
  M400
  {% if printer["gcode_button t" ~ idx ~ "_dock_sensor"].state == "PRESSED" %}
    _DOCK_SEAT_DONE IDX={idx} EARLY=1 OFF=0.2
  {% else %}
    _DOCK_SEAT_3 PREFIX={params.PREFIX} IDX={idx}
  {% endif %}

# dock_x is the DEEPEST of the +0.4/+0.2/0.0 approach steps. If the switch still has not tripped
# here, this head's real seated position is deeper than its dock_x (PH1's dock_x is ~2-3mm shallow),
# so hand off to the PAST-dock_x sweep instead of declaring it docked-but-loose.
[gcode_macro _DOCK_SEAT_3]
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set dx = svv[params.PREFIX ~ "_dock_x"]|float %}
  {% set idx = params.IDX|int %}
  G0 X{dx} F500
  M400
  {% if printer["gcode_button t" ~ idx ~ "_dock_sensor"].state == "PRESSED" %}
    _DOCK_SEAT_DONE IDX={idx} EARLY=1 OFF=0.0
  {% else %}
    # keep advancing PAST dock_x at reduced current (a hard contact slips instead of skipping steps)
    # until the dock switch trips. Unrolled _4.._9 (Klipper forbids a macro re-entering itself);
    # capped at dock_x-3.0 so it can never ram far (same depth the grab sweep already uses).
    SET_TMC_CURRENT STEPPER=stepper_x CURRENT=1.2
    _DOCK_SEAT_4 PREFIX={params.PREFIX} IDX={idx}
  {% endif %}

[gcode_macro _DOCK_SEAT_4]
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set dx = svv[params.PREFIX ~ "_dock_x"]|float %}
  {% set idx = params.IDX|int %}
  G0 X{dx - 0.5} F300
  M400
  {% if printer["gcode_button t" ~ idx ~ "_dock_sensor"].state == "PRESSED" %}
    _DOCK_SEAT_DONE IDX={idx} EARLY=2 OFF=0.5
  {% else %}
    _DOCK_SEAT_5 PREFIX={params.PREFIX} IDX={idx}
  {% endif %}

[gcode_macro _DOCK_SEAT_5]
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set dx = svv[params.PREFIX ~ "_dock_x"]|float %}
  {% set idx = params.IDX|int %}
  G0 X{dx - 1.0} F300
  M400
  {% if printer["gcode_button t" ~ idx ~ "_dock_sensor"].state == "PRESSED" %}
    _DOCK_SEAT_DONE IDX={idx} EARLY=2 OFF=1.0
  {% else %}
    _DOCK_SEAT_6 PREFIX={params.PREFIX} IDX={idx}
  {% endif %}

[gcode_macro _DOCK_SEAT_6]
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set dx = svv[params.PREFIX ~ "_dock_x"]|float %}
  {% set idx = params.IDX|int %}
  G0 X{dx - 1.5} F300
  M400
  {% if printer["gcode_button t" ~ idx ~ "_dock_sensor"].state == "PRESSED" %}
    _DOCK_SEAT_DONE IDX={idx} EARLY=2 OFF=1.5
  {% else %}
    _DOCK_SEAT_7 PREFIX={params.PREFIX} IDX={idx}
  {% endif %}

[gcode_macro _DOCK_SEAT_7]
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set dx = svv[params.PREFIX ~ "_dock_x"]|float %}
  {% set idx = params.IDX|int %}
  G0 X{dx - 2.0} F300
