############################################################################
########################## ProForge 5 Macros #############################
############################################################################

#config file version v1.2.0
#release date: 03.06.2026


[gcode_macro _END_PRINT]
gcode:
    # Lower build plate
    {% set current_z = printer.toolhead.position.z %}
    {% set max_z = printer.toolhead.axis_maximum.z %}
    {% set z_lower = 20 %}
    {% set new_z = current_z + z_lower %}
    M400                     ; Wait for all moves to finish
    G90                      ; Absolute positioning
    {% if new_z <= max_z - 5 %}
        G91                      ; Relative positioning
        G1 Z{z_lower} F600       ; Lower bed 20mm (raise nozzle)
        G90                      ; Back to absolute positioning
    {% else %}
        G1 Z{max_z - 5} F600     ; Move to Z max height -5
    {% endif %}

    # Assume toolchanger flow is OK unless proven otherwise
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=1

    G28 X Y

    # Dock active print head if carriage says one is mounted
    {% if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
        DOCK
    {% endif %}

    # Turn off heaters and fans
    M140 S0
    M104 S0 T0
    M104 S0 T1
    M104 S0 T2
    M104 S0 T3
    M104 S0 T4
    M106 S0

    CHAMBER_OFF

    # Only do final park + motor disable if docking succeeded
    {% if printer["gcode_macro _toolchanger_state"].can_continue|int == 1 %}
        G1 X500 Y400 F16000
        # Disable steppers
        M84
    {% else %}
        { action_respond_info("end print safe shutdown completed, but tool docking was not confirmed") }
        M117 check tool dock
    {% endif %}

    BED_MESH_CLEAR
    UPDATE_DELAYED_GCODE ID=FILTER_FAN_OFF DURATION=300
    SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_restore_tool VALUE=-1
    G90


[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  CLEAR_PAUSE
  _END_PRINT
  CANCEL_PRINT_BASE
  UPDATE_DELAYED_GCODE ID=FILTER_FAN_OFF DURATION=300
  G90

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
gcode:
  PAUSE_BASE
    # Lower build plate
    {% set current_z = printer.toolhead.position.z %}
    {% set max_z = printer.toolhead.axis_maximum.z %}
    {% set z_lower = 30 %}
    {% set new_z = current_z + z_lower %}
    M400                     ; Wait for all moves to finish
    G90                      ; Absolute positioning
    {% if new_z <= max_z - 5 %}
        G91                      ; Relative positioning
        G1 Z{z_lower} F600       ; Lower bed 20mm (raise nozzle)
        G90                      ; Back to absolute positioning
    {% else %}
        G1 Z{max_z - 5} F600             ; Move to Z max height -5
    {% endif %}
  FRONT
  SET_IDLE_TIMEOUT TIMEOUT=86400 #one day in seconds
  {% set active_extruder = printer.toolhead.extruder %}
  {% set current_temp = printer[active_extruder].temperature %}
  {% if active_extruder == "extruder" %}
  {% set tool_index = 0 %}
  {% else %}
  {% set tool_index = active_extruder[-1]|int %}
  {% endif %}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_restore_temp VALUE={current_temp}
  SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=extruder_restore_tool VALUE={tool_index}
  SET_GCODE_VARIABLE MACRO=_RESUME_WIPE VARIABLE=extruder_restore_tool VALUE={tool_index}
  {% if tool_index == 0 %}
  SET_GCODE_VARIABLE MACRO=_filament_load_0 VARIABLE=user_temp VALUE={current_temp}
  {% elif tool_index == 1 %}
  SET_GCODE_VARIABLE MACRO=_filament_load_1 VARIABLE=user_temp VALUE={current_temp}
  {% elif tool_index == 2 %}
  SET_GCODE_VARIABLE MACRO=_filament_load_2 VARIABLE=user_temp VALUE={current_temp}
  {% elif tool_index == 3 %}
  SET_GCODE_VARIABLE MACRO=_filament_load_3 VARIABLE=user_temp VALUE={current_temp}
  {% elif tool_index == 4 %}
  SET_GCODE_VARIABLE MACRO=_filament_load_4 VARIABLE=user_temp VALUE={current_temp}
  {% endif %}
  M118 Pausing... Saved temperature of tool T{tool_index}: {current_temp}°C

[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
variable_extruder_restore_temp: 0
variable_extruder_restore_tool: -1  # -1 means no tool was saved
gcode:
  # SAFETY GATE: never resume the print into an EMPTY carriage. A failed toolchange leaves
  # the "active" tool marked active but not physically grabbed - a plain RESUME would print
  # in air (that is the bug that just happened). If the carriage is empty, re-drive the grab
  # for the active tool, verify it, and only continue if a head is actually confirmed; else
  # stay PAUSED. If a head is already on the carriage, resume normally.
  {% set carriage = printer["gcode_button carriage_tool_sensor"].state %}
  {% set active_extruder = printer.toolhead.extruder %}
  {% set active = 0 if active_extruder == "extruder" else active_extruder[-1]|int %}
  {% set pending = printer["gcode_macro _toolchanger_state"].pending_tool|int %}
  # If a tool change was IN PROGRESS at the pause, re-grab the TARGET of that change - NOT the
  # active extruder. The "head reads undocked" pause fires in _PRE_SELECT_CHECK, BEFORE the new
  # tool's ACTIVATE_EXTRUDER, so the active extruder is still the PREVIOUS head. Re-grabbing the
  # active tool there grabs the WRONG (previous) head; pending_tool is the head the print was
  # actually selecting. Falls back to the active tool when no change was pending.
  {% set target = pending if (pending >= 0) else active %}
  {% set cc = printer["gcode_macro _toolchanger_state"].can_continue|int %}
  {% set retap = printer["gcode_macro _toolchanger_state"].tap_retap_pending|int %}
  # FAIL SAFE: act only when BOTH sensors AGREE; on any disagreement, REFUSE and stay paused rather
  # than guess. Guessing "held" prints headless; guessing "empty" re-grabs and DROPS a held head - so
  # neither guess is acceptable. A head is confirmed ON the carriage only when carriage PRESSED AND it
  # has left its own dock; the carriage is confirmed EMPTY only when carriage RELEASED AND the head is
  # still in its dock. Anything else means a switch is lying - pause and make the operator verify.
  {% set target_docked = printer["gcode_button t" ~ target ~ "_dock_sensor"].state == "PRESSED" %}
  {% if carriage == "PRESSED" and not target_docked %}
    # both sensors agree a head is on the carriage - resume (re-establishing Z0 first if TAP aborted)
    {% if retap == 1 %}
      { action_respond_info("RESUME: head confirmed on the carriage but Z0 not established (TAP aborted) - re-running the probe before continuing.") }
      _RESUME_RETAP
    {% else %}
      _RESUME_CONTINUE
    {% endif %}
  {% elif carriage == "RELEASED" and target_docked %}
    # both sensors agree the carriage is empty and the target head is still docked - re-grab it
    { action_respond_info("RESUME: carriage EMPTY and T%d in its dock (cc=%d) - re-grabbing the interrupted change's target (active extruder was T%d); will REFUSE if it cannot be confirmed." % (target, cc, active)) }
    _RESUME_SAFE_REGRAB TOOL={target}
  {% else %}
    # sensors DISAGREE (carriage says one thing, the target's dock the other) - a switch is faulty.
    # Do NOT guess: continuing risks a headless print, re-grabbing risks dropping a held head. Refuse
    # and stay paused (no RESUME_BASE) until the operator resolves it.
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
    { action_respond_info("!! RESUME REFUSED: sensors disagree - carriage=%s but T%d dock=%s. Cannot confirm a head on the carriage, so NOT resuming (never printing headless). PHYSICALLY CHECK the head: if it is mounted, a switch is faulty - reseat/fix it; if not, put it right. Then RESUME." % (carriage, target, "docked" if target_docked else "undocked")) }
    M117 RESUME refused: verify head/sensors
  {% endif %}

# Re-run the aborted TAP on resume, then continue. _TAP_IF_HEADED raises on a tap miss, which aborts
# THIS macro before the flag is cleared and before _RESUME_CONTINUE - so the print stays paused with
# tap_retap_pending still 1, and the next RESUME re-taps again (clean the nozzle and hit resume).
[gcode_macro _RESUME_CONTINUE]
description: internal - resume tail (temp restore + wipe + RESUME_BASE)
gcode:
  {% set rt = printer["gcode_macro RESUME"].extruder_restore_tool|int %}
  {% set rtemp = printer["gcode_macro RESUME"].extruder_restore_temp|float %}
  {% if rt >= 0 %}
    {% if rtemp > 0 %}
      M118 Resuming... Restoring temp {rtemp}C to tool T{rt}
      M109 S{rtemp} T{rt}
      M118 Resuming... Restored temp {rtemp}C to tool T{rt}
    {% else %}
      M118 Resuming... Tool T{rt} had no saved temperature.
    {% endif %}
    _RESUME_WIPE
  {% else %}
    M118 Resuming... No tool was previously active. Skipping wipe and temperature restore.
  {% endif %}
  RESUME_BASE
  SET_IDLE_TIMEOUT TIMEOUT=600

# Re-drive a failed pickup during RESUME, then verify before letting the print continue.
# Uses the reliable _TC_GRAB recipe; extruder + offsets are already set from the failed
# SELECT, so this only needs to physically get the head. Verification is deferred (moves
# must finish first) - the delayed_gcode below reads the carriage switch and decides.
[gcode_macro _RESUME_SAFE_REGRAB]
description: internal - re-grab the active tool on resume and verify a head landed
variable_tool: 0
gcode:
  {% set t = params.TOOL|int %}
  {% set prefix = ['zero','one','two','three','four'][t] %}
  SET_GCODE_VARIABLE MACRO=_RESUME_SAFE_REGRAB VARIABLE=tool VALUE={t}
  SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=1   # let the grab run
  _TC_GRAB PREFIX={prefix}
  G0 X0 F12000                                # retreat fully clear (pure X) before reading the switch
  M400
  UPDATE_DELAYED_GCODE ID=_delayed_resume_regrab_verify DURATION=0.3

[delayed_gcode _delayed_resume_regrab_verify]
gcode:
  {% set carriage = printer["gcode_button carriage_tool_sensor"].state %}
  {% set t = printer["gcode_macro _RESUME_SAFE_REGRAB"].tool|int %}
  {% set docked = printer["gcode_button t" ~ t ~ "_dock_sensor"].state == "PRESSED" %}
  {% if carriage == "PRESSED" and not docked %}
    # both sensors agree: head grabbed (on the carriage AND out of its dock)
    { action_respond_info("RESUME: re-grab of T%d confirmed (carriage PRESSED and left its dock)." % t) }
    SAVE_VARIABLE VARIABLE=held_tool VALUE={t}             # persist which head is held (survives restart)
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=1
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=already_selected VALUE=1
    {% if printer["gcode_macro _toolchanger_state"].tap_retap_pending|int == 1 %}
      _RESUME_RETAP        # TAP had aborted headless - re-establish Z0 now that the head is confirmed
    {% else %}
      _RESUME_CONTINUE
    {% endif %}
  {% else %}
    _SERVO_DOCK
    SET_GCODE_VARIABLE MACRO=_toolchanger_state VARIABLE=can_continue VALUE=0
    { action_respond_info("!! RESUME REFUSED: re-grab of T%d not confirmed (carriage=%s, dock=%s). Both sensors must agree a head is held and they do not. Print stays PAUSED - verify the head, then RESUME." % (t, carriage, "docked" if docked else "undocked")) }
  {% endif %}

[gcode_macro _RESUME_WIPE]
description: Wipe the nozzle after resuming on pause
variable_extruder_restore_tool: -1
gcode:
  {% set tool = extruder_restore_tool %}
  {% set svv = printer.save_variables.variables %}
  G90
  {% if tool == 0 %}
    G0 Y{svv.zero_dock_y} F20000
    G0 X{svv.zero_dock_x + 35} F20000
    G0 X{svv.zero_dock_x + 7} F9000
  {% elif tool == 1 %}
    G0 Y{svv.one_dock_y} F20000
    G0 X{svv.one_dock_x + 35} F20000
    G0 X{svv.one_dock_x + 7} F9000
  {% elif tool == 2 %}
    G0 Y{svv.two_dock_y} F20000
    G0 X{svv.two_dock_x + 35} F20000
    G0 X{svv.two_dock_x + 7} F9000
  {% elif tool == 3 %}
    G0 Y{svv.three_dock_y} F20000
    G0 X{svv.three_dock_x + 35} F20000
    G0 X{svv.three_dock_x + 7} F9000
  {% elif tool == 4 %}
    G0 Y{svv.four_dock_y} F20000
    G0 X{svv.four_dock_x + 35} F20000
    G0 X{svv.four_dock_x + 7} F9000
  {% else %}
    M118 Invalid tool index for RESUME_WIPE
  {% endif %}
  G92 E0
  G0 E10 F600     #Prime the nozzle
  G92 E0
  G0 E-0.5 F1500
  G92 E0
  _WIPE
  G0 X0 F20000

[gcode_macro _CHOME]
description: Homes XYZ axis only if printer is in a non-homed state
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

[gcode_macro _CHOME_TOOL]
description: Homes XY axis only if XY is in a non-homed state
gcode:
  {% if "xy" not in printer.toolhead.homed_axes %}
    G28 X Y
  {% endif %}

[gcode_macro CENTER]
description: Moves the toolhead to the center
gcode:
  _CHOME_TOOL
  G90
  G1 X250 Y200 F9000


[gcode_macro FRONT]
description: Moves the toolhead to the front
gcode:
  _CHOME_TOOL
  G90
  G1 X250 Y10 F9000


[gcode_macro UNLOAD_FILAMENT]
description: Unload filament from the currently selected tool head
gcode:
  {% set extruder = printer.toolhead.extruder %}
  {% if extruder == "extruder" %}
      {% set tool_head = 0 %}
  {% elif extruder == "extruder1" %}
      {% set tool_head = 1 %}
  {% elif extruder == "extruder2" %}
      {% set tool_head = 2 %}
  {% elif extruder == "extruder3" %}
      {% set tool_head = 3 %}
  {% elif extruder == "extruder4" %}
      {% set tool_head = 4 %}
  {% else %}
      {% set tool_head = 0 %}
  {% endif %}

  M117 Unloading filament from Tool{tool_head}
  SET_LED LED=SO3RGB_{tool_head} RED=0.0 GREEN=0.5 BLUE=0.5
  _filament_unload_init_{tool_head}

[delayed_gcode FILTER_FAN_OFF]
gcode:
  SET_FAN_SPEED FAN=filter_fan SPEED=0

