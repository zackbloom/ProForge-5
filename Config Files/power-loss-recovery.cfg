##############################################################################
################## ProForge 5 — Power-Loss Recovery (WIP) ####################
##############################################################################
#
#  STATUS: EXPERIMENTAL / UNTESTED.  NOT included by printer.cfg by default.
#  Do NOT enable on a printer you care about until it has been bench-tested with
#  a deliberate FIRMWARE_RESTART mid-print (never a real outage first), with the
#  emergency stop within reach.  See POWER_LOSS_RECOVERY.md for the test plan.
#
#  What this provides:
#    * _PLR_ON_LAYER      - call once per layer from the slicer to snapshot state
#    * _PLR_CLEAR         - clear saved state (called on normal end/cancel)
#    * RESUME_INTERRUPTED - after power returns, re-home, re-pick the saved tool,
#                           reheat, restore Z, and continue the SD file
#    * _PLR_ON_READY      - startup check that flags an available resume
#
#  Hard limitations (inherent to Klipper PLR, doubly so on a toolchanger):
#    * Z is TRUSTED, not re-probed. The leadscrews must have held position with
#      power off. Do not touch the gantry after an outage. (Re-probing would mean
#      driving the Eddy into the printed part — not possible cleanly.)
#    * The nozzle may be fused to the top layer; the first lift can peel the part.
#    * Byte-seek resume (M26) assumes the seek lands on a clean layer boundary and
#      that modal state (G90/M83/fan) matches what RESUME_INTERRUPTED sets up.
#    * Best-effort only. A UPS + mains-loss detector is the reliable solution;
#      this is the software half.
#
#  Depends on: fix/toolchanger-safety (the guarded SELECT_PHx / _CAL_SELECT path).
#  Re-picking a head with the collision guard MISSING is unsafe. Land that first.
##############################################################################

# Reuses the existing [save_variables] instance (variables.cfg). SAVE_VARIABLE
# updates only the named key, so PLR keys coexist with the offset/dock values.
# Keys used:  plr_state plr_file plr_sdpos plr_z plr_layer plr_tool
#             plr_bed_temp plr_tool_temp

[gcode_macro _PLR_SAVE]
description: Internal - persist one PLR key
gcode:
  SAVE_VARIABLE VARIABLE={params.KEY} VALUE={params.VALUE}

# ---------------------------------------------------------------------------
# Called ONCE PER LAYER from the slicer's layer-change g-code, e.g. add:
#     _PLR_ON_LAYER
# to Orca's "Layer change G-code". Snapshots the SD position (a clean boundary),
# Z height, active tool, and target temps so a resume can reconstruct them.
# ---------------------------------------------------------------------------
[gcode_macro _PLR_ON_LAYER]
description: Snapshot print state for power-loss recovery (call each layer)
gcode:
  {% if printer.print_stats.state == "printing" %}
    {% set e = printer.toolhead.extruder %}
    {% set tool = 0 if e == "extruder" else e[-1]|int %}
    _PLR_SAVE KEY=plr_file      VALUE="'{printer.print_stats.filename}'"
    _PLR_SAVE KEY=plr_sdpos     VALUE={printer.virtual_sdcard.file_position}
    _PLR_SAVE KEY=plr_z         VALUE={printer.gcode_move.gcode_position.z}
    _PLR_SAVE KEY=plr_layer     VALUE={printer.print_stats.info.current_layer|default(0)}
    _PLR_SAVE KEY=plr_tool      VALUE={tool}
    _PLR_SAVE KEY=plr_bed_temp  VALUE={printer.heater_bed.target}
    _PLR_SAVE KEY=plr_tool_temp VALUE={printer[e].target}
    _PLR_SAVE KEY=plr_state     VALUE=1
  {% endif %}

[gcode_macro _PLR_CLEAR]
description: Clear saved PLR state (call on normal print end / cancel)
gcode:
  _PLR_SAVE KEY=plr_state VALUE=0

# ---------------------------------------------------------------------------
# Startup notifier: if a print was in progress when power was lost, tell the
# user a resume is available. Wire into your existing ready/startup delayed_gcode
# or leave the [delayed_gcode] below (fires ~3s after klippy is ready).
# ---------------------------------------------------------------------------
[delayed_gcode _PLR_ON_READY]
initial_duration: 3
gcode:
  {% set svv = printer.save_variables.variables %}
  {% if svv.plr_state|default(0)|int == 1 %}
    { action_respond_info(
      "Power-loss recovery: an interrupted print was detected (tool PH%d, Z%.2f, layer %d). "
      "Do NOT move the gantry. Run RESUME_INTERRUPTED to attempt recovery, or CANCEL_PRINT to discard."
      % (svv.plr_tool|int + 1, svv.plr_z|float, svv.plr_layer|int)) }
    M117 Resume available: RESUME_INTERRUPTED
  {% endif %}

# ---------------------------------------------------------------------------
# The recovery sequence. Best-effort. Read every comment before enabling.
# ---------------------------------------------------------------------------
[gcode_macro RESUME_INTERRUPTED]
description: Attempt to continue a print interrupted by power loss
gcode:
  {% set svv = printer.save_variables.variables %}
  {% if svv.plr_state|default(0)|int != 1 %}
    { action_respond_info("No interrupted print saved - nothing to resume.") }
  {% else %}
    {% set z     = svv.plr_z|float %}
    {% set tool  = svv.plr_tool|int %}
    {% set sdpos = svv.plr_sdpos|int %}
    {% set file  = svv.plr_file %}
    {% set bedt  = svv.plr_bed_temp|float %}
    {% set toolt = svv.plr_tool_temp|float %}
    {% set clear = 5.0 %}   # blind Z lift to clear the last layer before homing XY

    RESPOND MSG="PLR: resuming {file} at Z{z} (tool PH{tool+1}, sdpos {sdpos})"

    # 1) Reheat bed (and the recovery tool) BEFORE any motion near the part.
    M140 S{bedt}
    M104 T{tool} S{toolt}

    # 2) Trust the saved Z (leadscrews held) and give Klipper a Z reference so we
    #    can lift without homing Z into the part. Then lift clear of the layer.
    SET_KINEMATIC_POSITION Z={z}
    G91
    G1 Z{clear} F600
    G90

    # 3) Home XY at the lifted height (clears the print), which the toolchanger
    #    needs before any dock/select move.
    G28 X Y

    # 4) Ensure the correct head is mounted. If a head is already on the carriage
    #    but it is the WRONG one, the guarded SELECT will dock it first.
    #    (Requires fix/toolchanger-safety.)
    {% if tool == 0 %}SELECT_PH1
    {% elif tool == 1 %}SELECT_PH2
    {% elif tool == 2 %}SELECT_PH3
    {% elif tool == 3 %}SELECT_PH4
    {% elif tool == 4 %}SELECT_PH5
    {% endif %}

    # 5) Wait for temps, then re-establish absolute Z reference again (SELECT may
    #    have moved/re-homed) by trusting the saved Z once more.
    M190 S{bedt}
    M109 T{tool} S{toolt}
    SET_KINEMATIC_POSITION Z={z}

    # 6) Prime a touch of filament to recover from the cold stop.
    G91
    G1 E1.0 F180
    G90

    # 7) Continue the SD file from the saved byte position.
    #    NOTE: this assumes sdpos is a clean layer boundary (it is saved at layer
    #    change) and that modal state matches. Validate on the bench.
    M23 {file}
    M26 S{sdpos}
    M24

    _PLR_SAVE KEY=plr_state VALUE=0
  {% endif %}
