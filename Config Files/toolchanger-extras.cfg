##############################################################################
##############  ProForge 5 — Toolchanger dock reseat  ########################
##############################################################################
#
#  Add to printer.cfg:  [include toolchanger-extras.cfg]
#
#  Provides:
#    RESEAT_DOCKS   - gently push not-quite-seated docked heads until their dock
#                     switch triggers (fixes the common "multiple heads read
#                     undocked" DOCK error, which usually just means a head isn't
#                     pushed in far enough)
#
#  RESEAT_DOCKS geometry note: the push targets each dock's *seated* X
#  (`<prefix>_dock_x`), the same position the real _DOCK_PHx motion drives to, at
#  a gentle feedrate. It never pushes past that, so it can't jam. If the empty
#  carriage doesn't contact a proud head (geometry differs on your machine), it
#  simply reports "not seated" - harmless. Tune the approach offsets below on the
#  bench before relying on it.
##############################################################################

# ---------------------------------------------------------------------------
# Reseat any docks that read undocked by gently pushing the head to its seated X.
# Safe preconditions: carriage empty (never nudge with a head mounted) + XY homed.
# ---------------------------------------------------------------------------
[gcode_macro RESEAT_DOCKS]
description: Nudge not-quite-seated docked heads until their switch triggers
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set active = svv.active_tools|default(0)|int %}
  M400
  {% set mounted = 1 if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" else 0 %}
  {% if "xy" not in printer.toolhead.homed_axes %}
    { action_respond_info("RESEAT_DOCKS: home XY first (G28 X Y). Aborting.") }
  {% else %}
    {% if mounted %}
      { action_respond_info("RESEAT_DOCKS: a head is mounted - using it as the pusher (dock_x+43, pin stays locked so it can't drop). Its own home reads undocked and gets a harmless nudge; run DOCK afterwards to place it.") }
    {% else %}
      { action_respond_info("RESEAT_DOCKS: bare carriage - pin released to 55deg, pushing to dock_x.") }
    {% endif %}
    {% for pair in [('zero',0),('one',1),('two',2),('three',3),('four',4)] %}
      {% if pair[1] < active and printer["gcode_button t" ~ pair[1] ~ "_dock_sensor"].state == "RELEASED" %}
        _RESEAT_ONE PREFIX={pair[0]} IDX={pair[1]} MOUNTED={mounted}
      {% endif %}
    {% endfor %}
    G90
    G0 X15 F12000
  {% endif %}

# VERY gentle stray-head nudge. The safety is the CURRENT, not luck: the contact push runs at
# ~0.7A (down from 2.2A) AND at low acceleration, so if it meets a seated / immovable head it
# just STALLS AND SLIPS - it physically can't skip steps or ram (that's what lost X/Y homing).
# It steps inward checking the head's dock switch and STOPS the instant it trips, and it never
# travels past the seated X, so it can't push a head into its backstop. mounted-head pusher =
# dock_x+43, bare carriage = dock_x. If the switch never trips (dead switch / not present), it
# gives up quietly instead of forcing - which is the whole point on a machine with bad switches.
[gcode_macro _RESEAT_ONE]
description: Internal - low-current, low-accel, switch-gated nudge of one stray head onto its pins
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set p = params.PREFIX %}
  {% set idx = params.IDX|int %}
  {% set mounted = params.MOUNTED|default(0)|int %}
  {% set cur = params.CURRENT|default(0.7)|float %}
  {% set dock_x = svv[p ~ "_dock_x"]|float %}
  {% set dock_y = svv[p ~ "_dock_y"]|float %}
  {% set off = 43 if mounted else 0 %}
  { action_respond_info("RESEAT: PH%d - gentle nudge at %.1fA / low accel (%s pusher), stops on switch" % (idx + 1, cur, "mounted-head" if mounted else "bare")) }
  {% if not mounted %}
    _SERVO_DOCK                                 # release the pin so the bare carriage pushes without grabbing
  {% endif %}
  G90
  G0 Y{dock_y} F9000
  G0 X{dock_x + off + 8} F9000                  # full-current travel to a CLEAR standoff (never contacts the head)
  SET_VELOCITY_LIMIT ACCEL=300                  # low accel - no hard jerk into the head
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cur}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cur}
  G0 X{dock_x + off + 3} F200                   # first gentle nudge; slips harmlessly on any contact
  M400
  _RESEAT_C1 PREFIX={p} IDX={idx} OFF={off}

[gcode_macro _RESEAT_C1]
description: internal - if it seated, stop here; else one more bounded nudge to the seated X
gcode:
  M400
  {% set svv = printer.save_variables.variables %}
  {% set idx = params.IDX|int %}
  {% set off = params.OFF|float %}
  {% set dock_x = svv[params.PREFIX ~ "_dock_x"]|float %}
  {% if printer["gcode_button t" ~ idx ~ "_dock_sensor"].state == "PRESSED" %}
    _RESEAT_FIN PREFIX={params.PREFIX} IDX={idx} OFF={off}
  {% else %}
    G0 X{dock_x + off} F200                     # final gentle nudge to the seated X - BOUNDED, never goes past
    M400
    _RESEAT_C2 PREFIX={params.PREFIX} IDX={idx} OFF={off}
  {% endif %}

[gcode_macro _RESEAT_C2]
description: internal - reseat done; hand to _RESEAT_FIN to restore currents and report
gcode:
  M400
  _RESEAT_FIN PREFIX={params.PREFIX} IDX={params.IDX} OFF={params.OFF}

[gcode_macro _RESEAT_FIN]
description: internal - restore current + accel, back off, report seated / left-alone
gcode:
  {% set cfg = printer.configfile.settings %}
  {% set idx = params.IDX|int %}
  {% set off = params.OFF|float %}
  {% set dock_x = printer.save_variables.variables[params.PREFIX ~ "_dock_x"]|float %}
  SET_TMC_CURRENT STEPPER=stepper_x CURRENT={cfg["tmc5160 stepper_x"].run_current} HOLDCURRENT={cfg["tmc5160 stepper_x"].hold_current}
  SET_TMC_CURRENT STEPPER=stepper_y CURRENT={cfg["tmc5160 stepper_y"].run_current} HOLDCURRENT={cfg["tmc5160 stepper_y"].hold_current}
  SET_VELOCITY_LIMIT ACCEL={cfg.printer.max_accel}
  G90
  G0 X{dock_x + off + 12} F6000                 # back the pusher off (full current restored)
  {% if printer["gcode_button t" ~ idx ~ "_dock_sensor"].state == "PRESSED" %}
    { action_respond_info("RESEAT: PH%d seated OK (switch now reads docked)" % (idx + 1)) }
  {% else %}
    { action_respond_info("RESEAT: PH%d still reads undocked - likely seated with a dead switch, or not present. Left it alone, no forcing." % (idx + 1)) }
  {% endif %}
