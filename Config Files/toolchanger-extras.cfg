##############################################################################
############  ProForge 5 — Toolchanger diagnostics & dock reseat  ############
##############################################################################
#
#  Add to printer.cfg:  [include toolchanger-extras.cfg]
#
#  Provides:
#    _TC_LOG        - dump toolchanger sensor/tool state to klippy.log (breadcrumbs)
#    RESEAT_DOCKS   - gently push not-quite-seated docked heads until their dock
#                     switch triggers (fixes the common "multiple heads read
#                     undocked" DOCK error, which usually just means a head isn't
#                     pushed in far enough)
#
#  RESEAT_DOCKS geometry note: the push targets each dock's *seated* X
#  (`<prefix>_dock_x`), the same position the real _DOCK_PHx motion drives to, at
#  a gentle feedrate. It never pushes past that, so it can't jam. If the empty
#  carriage doesn't contact a proud head (geometry differs on your machine), it
#  simply reports "not seated" - harmless. Tune the approach offsets below on the
#  bench before relying on it.
##############################################################################

# ---------------------------------------------------------------------------
# Diagnostic logger. Call as:  _TC_LOG CTX="some_label"
# Writes one line to klippy.log with the full toolchanger picture so a later
# failure can be reconstructed. RESPOND output is captured in klippy.log.
# ---------------------------------------------------------------------------
[gcode_macro _TC_LOG]
description: Log toolchanger sensor + tool state to klippy.log
gcode:
  {% set ctx = params.CTX|default("tc") %}
  {% set svv = printer.save_variables.variables %}
  {% set active = svv.active_tools|default(0)|int %}
  {% set e = printer.toolhead.extruder %}
  {% set docks = [] %}
  {% for i in range(active) %}
    {% set _ = docks.append(printer["gcode_button t" ~ i ~ "_dock_sensor"].state[0]) %}
  {% endfor %}
  { action_respond_info(
      "TC_LOG[%s] carriage=%s docks=%s(P=docked) ext=%s homed=[%s] can_continue=%s already_selected=%s"
      % (ctx,
         printer["gcode_button carriage_tool_sensor"].state,
         docks|join(''),
         e,
         printer.toolhead.homed_axes,
         printer["gcode_macro _toolchanger_state"].can_continue,
         printer["gcode_macro _toolchanger_state"].already_selected)) }

# ---------------------------------------------------------------------------
# Reseat any docks that read undocked by gently pushing the head to its seated X.
# Safe preconditions: carriage empty (never nudge with a head mounted) + XY homed.
# ---------------------------------------------------------------------------
[gcode_macro RESEAT_DOCKS]
description: Nudge not-quite-seated docked heads until their switch triggers
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set active = svv.active_tools|default(0)|int %}
  M400
  {% if printer["gcode_button carriage_tool_sensor"].state == "PRESSED" %}
    { action_respond_info("RESEAT_DOCKS: a head is on the carriage - dock it first. Aborting.") }
  {% elif "xy" not in printer.toolhead.homed_axes %}
    { action_respond_info("RESEAT_DOCKS: home XY first (G28 X Y). Aborting.") }
  {% else %}
    _TC_LOG CTX="reseat_start"
    {% for pair in [('zero',0),('one',1),('two',2),('three',3),('four',4)] %}
      {% if pair[1] < active and printer["gcode_button t" ~ pair[1] ~ "_dock_sensor"].state == "RELEASED" %}
        _RESEAT_ONE PREFIX={pair[0]} IDX={pair[1]}
      {% endif %}
    {% endfor %}
    G90
    G0 X15 F12000
    _TC_LOG CTX="reseat_end"
  {% endif %}

[gcode_macro _RESEAT_ONE]
description: Internal - push one head to its seated dock X and verify the switch
gcode:
  {% set svv = printer.save_variables.variables %}
  {% set p = params.PREFIX %}
  {% set idx = params.IDX|int %}
  {% set dock_x = svv[p ~ "_dock_x"]|float %}
  {% set dock_y = svv[p ~ "_dock_y"]|float %}
  {% set sensor = "gcode_button t" ~ idx ~ "_dock_sensor" %}
  { action_respond_info("RESEAT: nudging PH%d toward dock_x=%.2f" % (idx + 1, dock_x)) }
  G90
  G0 Y{dock_y} F9000
  G0 X{dock_x + 20} F9000              # approach from +X, clear of the parked head
  G0 X{dock_x + 5} F3000               # close in
  G0 X{dock_x} F400                    # gentle final push to the seated position
  M400
  G4 P250
  {% if printer[sensor].state == "PRESSED" %}
    { action_respond_info("RESEAT: PH%d seated OK." % (idx + 1)) }
  {% else %}
    { action_respond_info("RESEAT: PH%d still NOT seated - check the dock/switch manually." % (idx + 1)) }
  {% endif %}
  G0 X{dock_x + 20} F6000              # back off, leave the head parked
