##############################################################################
######  ProForge 5 — Power-Loss Recovery: toolchanger integration  ##########
######  Wraps BigTreeTech KlipperPLR and adds head re-pick + logging  #######
##############################################################################
#
#  STATUS: opt-in, test-gated.  Depends on fix/toolchanger-safety (the guarded
#  SELECT_PHx path). Do NOT enable without it — recovery re-picks a head.
#
#  KlipperPLR does the hard part safely: on interruption a shell script rebuilds
#  a resume g-code file with a fresh header (re-emits temps, sets M83 + G92 E0,
#  restores Z, lifts, homes XY, drops, and continues). That avoids the two
#  worst failure modes of a hand-rolled version:
#     * modal-state / relative-extrusion mismatch on resume (fixed: header rebuilt)
#     * corrupting the file mid-write (fixed: writes a separate plr/ file)
#
#  Our only additions are toolchanger-specific:
#     * _PLR_LOG_STATE  - per-layer snapshot of Z AND the active tool (+ logging)
#     * _PLR_REPICK_TOOL - mount the saved head (guarded) during resume
#  and a one-line injection into KlipperPLR's plr.sh (see plr-repick.patch) that
#  calls _PLR_REPICK_TOOL right after the rebuilt file's `G28 X Y`.
#
#  See POWER_LOSS_RECOVERY.md for install + slicer hooks + the test plan and the
#  residual limitations that NO software fixes (trusted Z with 4 leadscrews;
#  nozzle welded to the part).
##############################################################################

# ---------------------------------------------------------------------------
# Per-layer snapshot. Use THIS in the slicer's layer-change g-code instead of
# KlipperPLR's stock LOG_Z, so we also capture which head is printing.
# plr.sh consumes power_resume_z; _PLR_REPICK_TOOL consumes power_resume_tool.
# ---------------------------------------------------------------------------
[gcode_macro _PLR_LOG_STATE]
description: PLR per-layer snapshot (Z + active tool)
gcode:
    {% if printer.print_stats.state == "printing" %}
      {% set z = printer.gcode_move.gcode_position.z %}
      {% set e = printer.toolhead.extruder %}
      {% set tool = 0 if e == "extruder" else e[-1]|int %}
      SAVE_VARIABLE VARIABLE=power_resume_z VALUE={z}
      SAVE_VARIABLE VARIABLE=power_resume_tool VALUE={tool}
      # Concise breadcrumb in klippy.log for post-mortem (RESPOND is logged).
      { action_respond_info("PLR_SNAPSHOT z=%.3f tool=%d layer=%s"
          % (z, tool, printer.print_stats.info.current_layer|default('?'))) }
    {% endif %}

# ---------------------------------------------------------------------------
# Called by the rebuilt resume file (via the plr.sh injection) after `G28 X Y`.
# Ensures the head that was printing is the one on the carriage before the print
# continues. Relies on the guarded SELECT_PHx: if a different head is somehow
# mounted, SELECT docks it first; if the saved head is already on, SELECT no-ops.
# ---------------------------------------------------------------------------
[gcode_macro _PLR_REPICK_TOOL]
description: PLR - mount the saved print head before resuming
gcode:
    {% set tool = printer.save_variables.variables.power_resume_tool|default(0)|int %}
    { action_respond_info("PLR_REPICK begin: target=PH%d carriage=%s docks=%s"
        % (tool + 1,
           printer["gcode_button carriage_tool_sensor"].state,
           (printer["gcode_button t0_dock_sensor"].state[0],
            printer["gcode_button t1_dock_sensor"].state[0],
            printer["gcode_button t2_dock_sensor"].state[0],
            printer["gcode_button t3_dock_sensor"].state[0],
            printer["gcode_button t4_dock_sensor"].state[0]))) }
    {% if tool == 0 %}SELECT_PH1
    {% elif tool == 1 %}SELECT_PH2
    {% elif tool == 2 %}SELECT_PH3
    {% elif tool == 3 %}SELECT_PH4
    {% elif tool == 4 %}SELECT_PH5
    {% else %}
      { action_raise_error("PLR_REPICK: invalid saved tool index %d" % tool) }
    {% endif %}
    { action_respond_info("PLR_REPICK done: carriage=%s"
        % printer["gcode_button carriage_tool_sensor"].state) }
